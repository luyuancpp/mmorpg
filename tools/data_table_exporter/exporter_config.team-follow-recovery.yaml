excel:
  data_dir: ../../data
  operator_file: ../../data/operator/Operator.xlsx
  tip_file: ../../data/tip/Tip.xlsx
  data_begin_row: 6
  metadata_rows:
    field_name: 1
    field_type: 2
    owner: 3
    options: 4
    comment: 5
  server_owner_types:
  - server
  - common
output:
  generated_dir: ../../generated
  json_dir: ../../generated/tables
  binary_dir: ../../generated/tables
  proto_dir: ../../generated/code/proto
  proto_python_output_dir: ../../generated/code/proto/python
  state_dir: ./state
protoc:
  command: E:/work/xuanming-server-mmo/third_party/grpc/install_vs2026_dbg/bin/protoc.exe
  extra_includes:
  - ../../third_party/grpc/third_party/protobuf/src
languages:
  cpp:
    enabled: true
    code_dir: ../../generated/code/cpp
    proto_output_dir: ../../generated/code/proto/cpp
    constants_dir: ../../generated/code/cpp/constants
    table_id_dir: ../../generated/code/cpp/table_id
    bit_index_dir: ../../generated/code/cpp/bit_index
    deploy:
    - src: ../../generated/code/cpp
      dst: ../../cpp/generated/table/code
    - src: ../../generated/code/cpp/bit_index
      dst: ../../cpp/generated/table/code/bit_index
    - src: ../../generated/code/cpp/constants
      dst: ../../cpp/generated/table/code/constants
    - src: ../../generated/code/proto/cpp
      dst: ../../cpp/generated/table/proto
    - src: ../../generated/code/proto/cpp/operator
      dst: ../../cpp/generated/table/proto/operator
    - src: ../../generated/code/proto/cpp/tip
      dst: ../../cpp/generated/table/proto/tip
    - src: ../../generated/code/cpp/table_id
      dst: ../../cpp/generated/table/code/table_id
  go:
    enabled: true
    code_dir: ../../generated/code/go/generated/table
    proto_output_dir: ../../generated/code/go
    proto_import_path: shared/generated/pb/table
    constants_dir: ../../generated/code/go/generated/constants
    table_id_dir: ../../generated/code/go/generated/table/table_id
    bit_index_dir: ../../generated/code/go/generated/bit_index
    deploy:
    - src: ../../generated/code/go/generated
      dst: ../../go/shared/generated
  java:
    enabled: true
    code_dir: ../../generated/code/java
    proto_output_dir: ../../generated/code/proto/java
    package: com.game.table
    constants_dir: ../../generated/code/java/constants
    table_id_dir: ../../generated/code/java/table_id
    bit_index_dir: ../../generated/code/java/bit_index
    deploy:
    - src: ../../generated/code/java
      dst: ../../java/config_node/src/main/java/com/game/table
    - src: ../../generated/code/proto/java/com/game/table
      dst: ../../java/config_node/src/main/java/com/game/table
  csharp:
    enabled: true
    code_dir: ../../generated/code/csharp
    proto_output_dir: ../../generated/code/proto/csharp
    proto_import_path: ''
    package: MmorpgClient.Table
    deploy:
    - src: ../../generated/code/csharp
      dst: E:/work/output/team-follow-20261010/authorized-recovery/client-generated-staging/Assets/Scripts/Table/Generated
    - src: ../../generated/code/proto/csharp
      dst: E:/work/output/team-follow-20261010/authorized-recovery/client-generated-staging/Assets/Scripts/Table/Generated
  python:
    enabled: true
    code_dir: ../../generated/code/python/table
    proto_output_dir: ../../generated/code/proto/python
    proto_import_path: ''
    deploy: []
  ue:
    enabled: true
    code_dir: ../../generated/code/ue
    package: MMORPGCONFIG_API
    deploy: []
constant_tables:
- GlobalVariable
