syntax = "proto3";
option go_package = "common/database";

import "proto/db/proto_option.proto";
import "proto/common/rollback/transaction_log.proto";
import "proto/common/rollback/player_snapshot.proto";

// ============================================================================
// Transaction Log — append-only audit trail for all bidirectional operations.
// ============================================================================
message transaction_log
{
  option(OptionTableName) = "transaction_log";
  option(OptionPrimaryKey) = "tx_id";
  // 与 data_service 手写 DDL(transaction_log_store.go)逐条对齐的四条联合索引。
  // proto2mysql 语义:分号分隔多索引、逗号 = 联合索引;原来的单串
  // "from_player,to_player,item_uuid,timestamp" 会被解释成一条 4 列联合索引,
  // 对按 to_player / tx_type 单独过滤的查询没用。
  option(OptionIndex) = "from_player,timestamp_sec;to_player,timestamp_sec;item_config_id,timestamp_sec;tx_type,timestamp_sec";
  // 雪花主键 + 全服最高频追加写,按 §D3 处方 NONCLUSTERED + 打散(global-data-layer-tidb-decision.md)
  option(OptionTiDBNonclusteredPK) = true;
  option(OptionTiDBShardRowIDBits) = 4;
  option(OptionTiDBPreSplitRegions) = 4;

  uint64 tx_id = 1;
  // 列名与手写 DDL 统一为 timestamp_sec(Unix 秒)。proto2mysql 按 pb:N 字段号识别列,
  // 改名不需要 OptionOldName;且改名时全仓尚无一行数据。
  uint64 timestamp_sec = 2;
  uint32 tx_type = 3;           // TransactionType enum
  uint64 from_player = 4;
  uint64 to_player = 5;
  uint64 item_uuid = 6;
  uint32 item_config_id = 7;
  uint32 item_quantity = 8;
  uint32 currency_type = 9;
  int64 currency_delta = 10;
  uint64 balance_before = 11;
  uint64 balance_after = 12;
  uint64 correlation_id = 13;
  // proto2mysql 把 string 映射成 MEDIUMTEXT,已比手写 DDL 的 VARCHAR(1024) 宽,无需额外选项。
  string extra = 14;
  // 记录时所在的 zone,镜像 TransactionLogEntry.zone_id(transaction_log.proto 字段 15)。
  // 表已定在全局库一处,没有这一列就分不清同一 tx 来自哪个 zone;
  // data_service 的 Kafka 消费者按列名自动探测,老表缺列时按 0 写入,不需要迁移开关。
  uint32 zone_id = 15;
}

// ============================================================================
// Player snapshot table (for rollback) — 从 mysql_database_table.proto 移入:
// 导表器按那个文件的 message 成员生成 zone 库建表清单
// (generated/data/mysql_database_table_list.json),而本表只该存在于全局库
// (data_service)一处。决策见 docs/design/node-id-overhaul-plan-20260908.md。
// ============================================================================
message player_snapshot
{
  option(OptionTableName) = "player_snapshot";
  option(OptionPrimaryKey) = "id";
  option(OptionAutoIncrementKey) = "id";
  // 分号 = 两条独立索引(proto2mysql 语义:分号分隔多索引,逗号 = 联合索引)。
  // snapshot_guid 刻意用普通 INDEX 而不是 UNIQUE:GM/data_service 产生的行没有 guid,
  // proto2mysql 的 nullable 选项只去掉 NOT NULL、仍保留 DEFAULT 0,且写入路径对未设置的
  // 标量一律绑 0 —— UNIQUE 会让第二条 GM 行就撞键。去重责任在消费者:落库前按
  // snapshot_guid 先查后插(check-then-insert),见 docs/design/node-id-overhaul-plan-20260908.md §2.0c。
  // (zone_id, created_at) 是 RollbackZone 的扫描键(GetSnapshotPlayerIDsByZone:
  // WHERE zone_id=? AND created_at<=?)。此前只存在于手写 DDL,proto 里漏了,
  // 于是 store 侧靠 extraIndexes 兜底建它 —— 补进来之后那段兜底会自行失效
  // (它按"想要的索引已被覆盖"判断)。
  option(OptionIndex) = "player_id;snapshot_guid;zone_id,created_at";
  // 自增主键同样单调递增,按 §D3 处方 NONCLUSTERED + 打散;自增值非连续可接受(无连续性依赖)
  option(OptionTiDBNonclusteredPK) = true;
  option(OptionTiDBShardRowIDBits) = 4;
  option(OptionTiDBPreSplitRegions) = 4;

  uint64 id = 1;             // Auto-increment snapshot ID
  uint64 player_id = 2;      // Player this snapshot belongs to
  uint32 zone_id = 3;        // Player's home zone at snapshot time
  uint32 snapshot_type = 4;  // SnapshotType enum value
  uint64 created_at = 5;     // Unix timestamp of snapshot creation
  string reason = 6;         // Reason / description
  string operator = 7;       // GM operator who created it
  bytes  data = 8;           // Serialized snapshot data (proto SnapshotData)
  // C++ scene 经 Kafka 送来的 PlayerSnapshotEntry.snapshot_id(SnowFlake)。GM 行为 0。
  // 不改主键:rollback_audit_log.snapshot_id_used 引用的是自增 id,换主键等于篡改历史审计。
  uint64 snapshot_guid = 9;
  // 来源:0 = GM/data_service 直接写入(data 列是 Redis 字段图 JSON),
  //       1 = C++ scene Kafka 落库(data 列是 PlayerSnapshotEntry 的两个 proto blob)。
  // 两种格式不兼容,回滚读路径在学会解 proto blob 之前必须先过滤 source=0。
  uint32 source = 10;
}

// ============================================================================
// Rollback audit log — 同 player_snapshot,只在全局库(data_service)一处。
// ============================================================================
message rollback_audit_log
{
  option(OptionTableName) = "rollback_audit_log";
  option(OptionPrimaryKey) = "id";
  option(OptionAutoIncrementKey) = "id";
  // 自增主键同样单调递增,按 §D3 处方 NONCLUSTERED + 打散;自增值非连续可接受(无连续性依赖)
  option(OptionTiDBNonclusteredPK) = true;
  option(OptionTiDBShardRowIDBits) = 4;
  option(OptionTiDBPreSplitRegions) = 4;

  uint64 id = 1;
  uint64 player_id = 2;          // 0 for zone/server rollback
  uint32 zone_id = 3;            // 0 for server-wide rollback
  uint32 rollback_type = 4;      // 1=player, 2=zone, 3=server
  uint64 snapshot_id_used = 5;   // Which snapshot was restored (single-player only)
  uint64 pre_rollback_snapshot_id = 6;  // Safety snapshot before rollback
  uint64 target_time = 7;        // Target rollback timestamp
  uint32 players_affected = 8;
  uint32 players_failed = 9;
  string reason = 10;
  string operator = 11;          // GM operator
  uint64 created_at = 12;        // When the rollback was executed
  // 收口 DDL/proto 漂移:data_service 手写 DDL(snapshot_store.go)早已有此列,proto 一直缺。
  uint32 orphans_cleaned = 13;   // RollbackZone 清理掉的孤儿玩家数
}

// ============================================================================
// Player Debt — deferred-clawback (补缴) records; separate from CurrencyComp
// so GM tool can query/manage offline.
//
// 【已弃用,2026-10-15,docs/design/player-inbox-service.md D9】不再接任何读写,新代码禁止引用。
// - 欠款与封锁的唯一事实源是玩家存档里的 CurrencyComp.debts / blocked_types(proto/common/component/currency_comp.proto),
//   随 player_database 落盘;本表全仓没有任何读写方,再接一份就是第二份事实源(DRY)。
// - GM 挂欠款 / 封锁获取走玩家收件箱:PlayerInboxAdmin.GmSanctionPlayer 入箱 → owner scene 执行 CurrencySystem::AttachDebt 等。
// - 本批只加注释、保留定义(不改字段,不动生成产物的结构);是否删除另行评审。
// ============================================================================
message player_debt
{
  option(OptionTableName) = "player_debt";
  option(OptionPrimaryKey) = "player_id,currency_type";
  option(OptionIndex) = "player_id";

  uint64 player_id = 1;
  uint32 currency_type = 2;
  uint64 owed_amount = 3;
  uint64 paid_amount = 4;
  bool frozen = 5;              // GM freeze — pauses auto-deduction
  string reason = 6;
  string gm_operator = 7;
  uint64 created_at = 8;
  uint64 expires_at = 9;        // 0 = never
  uint64 completed_at = 10;     // 0 = not yet completed
}

// ============================================================================
// Rollback Audit — every rollback operation is logged for accountability.
// ============================================================================
message rollback_audit
{
  option(OptionTableName) = "rollback_audit";
  option(OptionPrimaryKey) = "audit_id";
  option(OptionIndex) = "player_id";

  uint64 audit_id = 1;
  uint64 player_id = 2;
  uint64 snapshot_id = 3;       // Which snapshot was used
  uint64 target_time = 4;       // The time the player was rolled back to
  uint64 executed_at = 5;       // When the rollback was executed
  string gm_operator = 6;
  string reason = 7;
  string scope = 8;             // "full" or comma-separated service names (e.g. "currency,bag")
  uint32 items_restored = 9;
  uint32 items_skipped = 10;    // Skipped due to transfer records
  uint32 currencies_restored = 11;
  uint32 currencies_skipped = 12;
  string diff_json = 13;        // Serialized SnapshotDiff for human review
}

// ============================================================================
// ID Segment — Leaf-segment 号段表(永久身份 player_id / guild_id / item guid 的发号源)。
// 一个持有者用一次 CAS(WHERE biz_tag=? AND version=?)领走 [max_id, max_id+step),
// 不依赖 lease / 时钟 / worker id。
// 放在本文件而不是 mysql_database_table.proto:导表器按那个文件的 message 成员生成
// go/db 的 zone 库建表清单(generated/data/mysql_database_table_list.json),而号段表
// 只该存在于全局库(data_service)一处。
// 值域上限 2^55,与存量 snowflake 号(≥ 6.7e16)永不相交,新旧号可共存。
// 见 docs/design/node-id-overhaul-plan-20260908.md §6。
// ============================================================================
message id_segment
{
  option(OptionTableName) = "id_segment";
  option(OptionPrimaryKey) = "biz_tag";
  // 主键是短字符串、行数只有几条(player / guild / item),没有写热点;
  // 仍按 §D3 声明 NONCLUSTERED + 打散,与全局库其余表口径一致,免得日后加 biz_tag 时再迁。
  option(OptionTiDBNonclusteredPK) = true;
  option(OptionTiDBShardRowIDBits) = 4;
  option(OptionTiDBPreSplitRegions) = 4;

  string biz_tag = 1;   // "player" / "guild" / "item"
  uint64 max_id = 2;    // 已分配到(不含);下一段从这里开始
  uint32 step = 3;      // 每次领段的长度,按"10 分钟峰值发号量"配
  uint64 version = 4;   // CAS 版本号,每次领段 +1
}

// ============================================================================
// Player Name — 玩家名字注册表(全服唯一)。
// 放在本文件而不是 mysql_database_table.proto:导表器按那个文件的 message 成员生成
// go/db 的 zone 库建表清单(generated/data/mysql_database_table_list.json),而名字
// 唯一性只有"全服一张表"才成立 —— 每个 zone 一份就变成"区内唯一",跨区重名。
// 真源在这里;zone 库 player_database.profile_component 与账号记录
// AccountSimplePlayer.name 都只是只读副本,可能缺失,读侧回源 BatchGetPlayerName。
//
// 【为什么这张表不靠 proto2mysql 建】proto2mysql v0.1.0 把 string 渲染成 MEDIUMTEXT
// (proto2mysql.go:259),而 TEXT 列上建 UNIQUE KEY 会被 MySQL 以 1170(BLOB/TEXT
// column used in key specification without a key length)拒掉。所以本表和 id_segment
// 一样走 store/schema.go 的 bootstrap DDL(name/name_norm 建成 VARCHAR),本 message
// 只作为列漂移校验的事实源 —— 改了这里就必须同步改 bootstrap DDL,否则启动校验会报。
// VARCHAR 长度 < 191,唯一键覆盖整列,不需要 D-14 §2 的 191 前缀写法。
//
// D-14 §2 复核:主键是整数列 player_id;全表只有一个唯一键(name_norm);
// 按 §D3 声明 NONCLUSTERED + 打散(雪花 player_id 做主键 = 写热点)。
// 设计见 docs/design/guild-phase2/03-names.md §3.2 / §3.3。
// ============================================================================
message player_name
{
  option(OptionTableName) = "player_name";
  option(OptionPrimaryKey) = "player_id";
  option(OptionUniqueKey) = "name_norm";
  option(OptionTiDBNonclusteredPK) = true;
  option(OptionTiDBShardRowIDBits) = 4;
  option(OptionTiDBPreSplitRegions) = 4;

  uint64 player_id  = 1;
  // NFKC 归一 + 去首尾空白后的展示名(保留大小写),下发客户端的就是这一份。
  string name       = 2;
  // name 再转小写;唯一性只看它。展示名与唯一键分列是为了"显示保留大小写、
  // 判重忽略大小写",两列必须由同一套规则包(go/shared/playername)一起算出来。
  string name_norm  = 3;
  // 登记时刻 Unix 毫秒(data_service 进程时钟)。ReleasePlayerName 的无 token 分支
  // 只删落在 PlayerName.ReleaseWindow 内的行(login 建角失败的补偿),
  // 超窗的孤儿行只能由运维带 x-admin-token 清 —— 没有这一列就没法区分两者。
  uint64 created_ms = 4;
}

// ============================================================================
// 路由表(玩家归属与落点映射持久化 D1,docs/design/player-route-mapping-durability-proposal.md §3.2 / §13)。
//
// 下面五个 message **只作列漂移守卫的事实源**(与 id_segment / player_name 同一模式):
// 表由 go/data_service/internal/store/schema.go 的 bootstrap DDL 预建(要 VARCHAR、可空列、CHECK、
// 带片前缀的二级索引,proto2mysql 都生成不了),**不交给 proto2mysql 建表或同步**。迁移期按这里的字段名
// 查线上表的列齐不齐、按 OptionPrimaryKey 查主键列序(schema.go 的 assertRouteTableShapes)。
// 所以:改了这里必须同步改 bootstrap DDL,反之亦然,否则启动期迁移直接拒绝。
//
// 字段号:player_route 沿用 DDL 列注释里预留的 pb:1..10(route_shard 是 10,player_id 仍是 1);
// 另外四张的字段号按 DDL 列序新定,并同步写进 DDL 的列注释 pb:N(route_store_test 钉住两边一致)。
// 与 §4.3 同规矩:上线后不复用,删字段写 reserved。
// 库里可为 NULL 的列在这里用零值表达(0 / 空串 = NULL),与 store.RouteRow 的约定一致;
// 本 message 不是读写载体,读写只在 store 的 SQL 里,所以不用 optional。
// 主键是聚簇的(TiDB CLUSTERED,见 schema.go 注释),不声明 OptionTiDBNonclusteredPK;
// 二级索引只写在 DDL 里,这里不声明 OptionIndex(这几张表不跑 ensureIndexes)。
// 放在本文件而不是 mysql_database_table.proto 的原因与 id_segment 相同:路由表只在全局库。
// ============================================================================

// player_route:每个玩家一行,home 与落点同行。
message player_route
{
  option(OptionTableName) = "player_route";
  option(OptionPrimaryKey) = "route_shard,player_id";

  uint64 player_id         = 1;
  uint32 home_zone         = 2;  // 0 = NULL(没有归属区)
  uint32 storage_id        = 3;  // 0 = NULL;与 placement_version 同 NULL(chk_route_place)
  uint64 placement_version = 4;  // 0 = NULL;有落点时 >= 1
  string frozen_run_id     = 5;  // 空串 = NULL;非空 = 搬库冻结态
  uint64 rev               = 6;  // 本行任一列变化 +1,只供缓存排序(player:maprev)
  string updated_by        = 7;  // 写者标识(ASCII,<= 96)
  uint64 created_at_ms     = 8;  // 库时钟 Unix 毫秒
  uint64 updated_at_ms     = 9;  // 库时钟 Unix 毫秒
  uint32 route_shard       = 10; // = player_id % 64(placement.RouteRowShards,chk_route_shard)
}

// zone_merge_fence:合服围栏真源,按 (zone_id, shard) 存 N 份相同内容。
message zone_merge_fence
{
  option(OptionTableName) = "zone_merge_fence";
  option(OptionPrimaryKey) = "zone_id,shard";

  uint32 zone_id       = 1;
  uint32 shard         = 2;
  string run_id        = 3;  // 空串 = NULL(未封锁);与 expires_at_ms 同 NULL(chk_fence_pair)
  string purpose       = 4;  // 空串 = NULL
  uint32 src_zone      = 5;  // 0 = NULL
  uint32 dst_zone      = 6;  // 0 = NULL
  uint64 expires_at_ms = 7;  // 0 = NULL;库时钟 Unix 毫秒
  string holder_json   = 8;  // 空串 = NULL;排障用持有者描述
  uint64 fence_epoch   = 9;  // 每次获取 +1,围栏镜像 set-if-newer 的依据
}

// zone_merged_into:「源区已合走」的永久标记。
message zone_merged_into
{
  option(OptionTableName) = "zone_merged_into";
  option(OptionPrimaryKey) = "src_zone";

  uint32 src_zone     = 1;
  uint32 dst_zone     = 2;
  string run_id       = 3;
  uint64 merged_at_ms = 4;  // 库时钟 Unix 毫秒
}

// route_meta:开关表,单行(id=1),库世代与可写开关。
message route_meta
{
  option(OptionTableName) = "route_meta";
  option(OptionPrimaryKey) = "id";

  uint32 id         = 1;
  string generation = 2;  // 1..32 位 hex
  uint32 writable   = 3;  // 0 = 全体映射写者拒写
}

// route_reconcile:对账表,单行(id=1),对账 leader 的租约、水位与缓存校验时刻。
message route_reconcile
{
  option(OptionTableName) = "route_reconcile";
  option(OptionPrimaryKey) = "id";

  uint32 id                = 1;
  string leader            = 2;  // 空串 = NULL
  uint64 lease_until_ms    = 3;  // 0 = NULL;库时钟 Unix 毫秒
  uint64 watermark_ms      = 4;
  uint64 cache_verified_ms = 5;
}
