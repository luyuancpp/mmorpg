syntax = "proto3";
option go_package = "common/component";



message PlayerSkillComp {
  uint64 id = 1; 
  uint32 skill_table_id = 2; 
  // 技能等级(2026-10-19 四职业技能,docs/design/class-skills.md §3)。
  // 职业技能(Skill.class_id != 0):已学为 1..Skill.max_rank;0 不是"未学",是坏记录,加载时剔除 ——
  // 未学的职业技能根本不出现在本列表里。旧通用技能(Skill.class_id == 0)不分等级,本字段恒为 0、读写都忽略。
  uint32 rank = 3;
}

message PlayerSkillListComp {
  repeated PlayerSkillComp skill_list = 1;
}