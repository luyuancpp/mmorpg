syntax = "proto3";
package match;
option go_package = "match/match";

import "proto/common/base/tip.proto";

// 机房是部署身份，不是逻辑区服。探测值只能由该机房的受信端点测量并签名。
message NetworkProbeGrant {
  string plan_id = 1;
  uint64 player_id = 2;
  string session_binding = 3;
  uint32 physical_region = 4;
  uint32 target_node_id = 5;
  string target_instance_id = 6;
  uint64 expires_at_ms = 7;
}

message SignedNetworkProbe {
  bytes payload = 1;
  bytes signature = 2;
}

message NetworkProbeTarget {
  uint32 physical_region = 1;
  string host = 2;
  uint32 port = 3;
  SignedNetworkProbe grant = 4;
}

message GetNetworkProbePlanRequest {}
message GetNetworkProbePlanResponse {
  string plan_id = 1;
  repeated NetworkProbeTarget targets = 2;
  uint64 expires_at_ms = 3;
  TipInfoMessage error_message = 4;
  bool required = 5;
}

// 回执绑定完整计划与会话；客户端没有可填写的 RTT 字段。
message NetworkProbeReceipt {
  NetworkProbeGrant grant = 1;
  uint32 rtt_ms = 2;
  uint32 sample_count = 3;
  uint64 measured_at_ms = 4;
  uint64 expires_at_ms = 5;
}
message CommitNetworkProbeRequest {
  string plan_id = 1;
  repeated SignedNetworkProbe receipts = 2;
}
message CommitNetworkProbeResponse {
  uint64 expires_at_ms = 1;
  TipInfoMessage error_message = 2;
}

// 以下消息直接使用现有 ProtobufCodec 经 battle 公网端口传输，不占玩家 RPC 消息号。
message NetworkProbeStart { SignedNetworkProbe grant = 1; }
message NetworkProbeChallenge { bytes nonce = 1; uint32 sample_index = 2; }
message NetworkProbeEcho { bytes nonce = 1; uint32 sample_index = 2; }
message NetworkProbeComplete { SignedNetworkProbe receipt = 1; }
