syntax = "proto3";
package trade;
option go_package = "trade";

import "proto/common/base/tip.proto";

// 客户端只选择自己已有资产，不提交实例快照或声称付款成功。
// 实例属性由唯一在线资产权威提取；集合上限由服务端在写事务前及提交时复核。
message TradeAssetSelection {
  map<uint32, uint32> items = 1;       // 可叠加配置及数量，最多16种
  repeated uint64 item_uuids = 2;      // 完整唯一实例，最多8件
  uint64 pet_id = 3;                   // 0表示不含宝宝
  uint32 currency_type = 4;
  uint64 currency_amount = 5;
}

enum CommerceOrderKind {
  COMMERCE_ORDER_KIND_UNSPECIFIED = 0;
  COMMERCE_ORDER_KIND_OFFICIAL = 1;
  COMMERCE_ORDER_KIND_PLAYER_TRADE = 2;
  COMMERCE_ORDER_KIND_CONSIGNMENT = 3;
  COMMERCE_ORDER_KIND_MARKET_MATCH = 4;
  COMMERCE_ORDER_KIND_AUCTION_LOT = 5;
}

enum CommerceOrderState {
  COMMERCE_ORDER_STATE_UNSPECIFIED = 0;
  COMMERCE_ORDER_STATE_WAITING_CONFIRMATION = 1;
  COMMERCE_ORDER_STATE_AWAITING_PAYMENT = 2;
  COMMERCE_ORDER_STATE_ESCROWING = 3;
  COMMERCE_ORDER_STATE_DELIVERING = 4;
  COMMERCE_ORDER_STATE_DELIVERED = 5;
  COMMERCE_ORDER_STATE_CANCEL_PENDING = 6;
  COMMERCE_ORDER_STATE_CANCELLED = 7;
  COMMERCE_ORDER_STATE_REFUND_PENDING = 8;
  COMMERCE_ORDER_STATE_REFUNDED = 9;
  COMMERCE_ORDER_STATE_MANUAL = 10;
  COMMERCE_ORDER_STATE_SETTLED = 11;
}

message CommerceOrderView {
  string order_id = 1;                  // 不透明稳定订单号
  CommerceOrderKind kind = 2;
  CommerceOrderState state = 3;
  uint64 seller_player_id = 4;
  uint64 buyer_player_id = 5;
  uint64 amount = 6;                    // 最小单位整数
  string currency = 7;                  // 官方渠道币种或游戏货币类型
  uint64 created_ms = 8;
  uint64 version = 9;
  bool seller_confirmed = 10;
  bool buyer_confirmed = 11;
  string related_id = 12;               // 商品/挂单/竞拍标识
}

message CommerceOrderResponse {
  TipInfoMessage error_message = 1;
  CommerceOrderView order = 2;
  uint64 server_now_ms = 3;
  TradeAssetSelection seller_assets = 4;
  TradeAssetSelection buyer_assets = 5;
  repeated TradeOfferInstance seller_item_instances = 6;
  repeated TradeOfferInstance buyer_item_instances = 7;
  TradeOfferInstance seller_pet = 8;
  TradeOfferInstance buyer_pet = 9;
}
message GetCommerceOrderRequest { string order_id = 1; }
message CancelCommerceOrderRequest { string order_id = 1; }
message ListCommerceOrdersRequest { string cursor = 1; uint32 limit = 2; }
message ListCommerceOrdersResponse {
  TipInfoMessage error_message = 1;
  repeated CommerceOrderView orders = 2;
  string next_cursor = 3;
  uint64 server_now_ms = 4;
}

// 新合同的公开发现入口；旧P1 listing种子不冒充已托管商品，不与新ID混用。
message TradeOfferInstance { uint64 instance_id = 1; uint32 config_id = 2; uint32 count = 3; string name = 4; uint32 level = 5; }
message CommerceOfferView {
  CommerceOrderView order = 1;
  TradeAssetSelection assets = 2;
  repeated TradeOfferInstance item_instances = 3;
  TradeOfferInstance pet = 4;
  AuctionLotView auction = 5;
}
message BrowseCommerceOffersRequest { CommerceOrderKind kind = 1; string cursor = 2; uint32 limit = 3; }
message BrowseCommerceOffersResponse { TipInfoMessage error_message = 1; repeated CommerceOfferView offers = 2; string next_cursor = 3; uint64 server_now_ms = 4; }

message OfficialSkuView {
  uint64 sku_id = 1;
  string title = 2;
  uint64 price_minor = 3;
  string currency = 4;
  uint64 available = 5;
}
message ListOfficialSkusRequest { uint64 after_sku_id = 1; uint32 limit = 2; }
message ListOfficialSkusResponse {
  TipInfoMessage error_message = 1;
  repeated OfficialSkuView skus = 2;
  uint64 next_sku_id = 3;
}
message CreateOfficialOrderRequest {
  string client_request_id = 1;
  uint64 sku_id = 2;
  uint32 quantity = 3;
}

message CreatePlayerTradeRequest {
  string client_request_id = 1;
  uint64 buyer_player_id = 2;
  TradeAssetSelection seller_assets = 3;
  TradeAssetSelection buyer_assets = 4;
}
message ConfirmPlayerTradeRequest { string order_id = 1; }

message CreateConsignmentRequest {
  string client_request_id = 1;
  TradeAssetSelection assets = 2;
  uint32 currency_type = 3;
  uint64 price = 4;
  uint64 duration_ms = 5;
}
message BuyConsignmentRequest { string listing_id = 1; string client_request_id = 2; }
message CancelConsignmentRequest { string listing_id = 1; }

enum MarketOrderSide {
  MARKET_ORDER_SIDE_UNSPECIFIED = 0;
  MARKET_ORDER_SIDE_BUY = 1;
  MARKET_ORDER_SIDE_SELL = 2;
}
message PlaceMarketOrderRequest {
  string client_request_id = 1;
  uint32 market_id = 2;
  uint32 item_config_id = 3;
  MarketOrderSide side = 4;
  uint32 quantity = 5;
  uint64 unit_price = 6;
  uint32 currency_type = 7;
}
message CancelMarketOrderRequest { string market_order_id = 1; }
message MarketOrderView {
  string market_order_id = 1;
  uint32 market_id = 2;
  uint32 item_config_id = 3;
  MarketOrderSide side = 4;
  uint32 quantity = 5;
  uint32 filled_quantity = 6;
  uint64 unit_price = 7;
  uint32 currency_type = 8;
  string state = 9;
  uint64 created_ms = 10;
}
message MarketOrderResponse { TipInfoMessage error_message = 1; MarketOrderView order = 2; }
message ListMarketOrdersRequest { string cursor = 1; uint32 limit = 2; }
message ListMarketOrdersResponse {
  TipInfoMessage error_message = 1;
  repeated MarketOrderView orders = 2;
  string next_cursor = 3;
}
message GetMarketDepthRequest { uint32 market_id = 1; uint32 item_config_id = 2; uint32 limit = 3; }
message MarketDepthLevel { uint64 unit_price = 1; uint64 quantity = 2; }
message GetMarketDepthResponse {
  TipInfoMessage error_message = 1;
  repeated MarketDepthLevel asks = 2;
  repeated MarketDepthLevel bids = 3;
  uint64 server_now_ms = 4;
}
message TradeMarketView { uint32 market_id = 1; uint32 item_config_id = 2; string title = 3; uint32 currency_type = 4; }
message ListTradeMarketsRequest {}
message ListTradeMarketsResponse { TipInfoMessage error_message = 1; repeated TradeMarketView markets = 2; }

message CreateAuctionLotRequest {
  string client_request_id = 1;
  TradeAssetSelection assets = 2;
  uint32 currency_type = 3;
  uint64 opening_price = 4;
  uint64 minimum_increment = 5;
  uint64 duration_ms = 6;
}
message PlaceAuctionBidRequest { string lot_id = 1; string client_request_id = 2; uint64 amount = 3; }
message GetAuctionLotRequest { string lot_id = 1; }
message CancelAuctionLotRequest { string lot_id = 1; }
message AuctionLotView {
  string lot_id = 1;
  uint64 seller_player_id = 2;
  uint32 currency_type = 3;
  uint64 opening_price = 4;
  uint64 minimum_increment = 5;
  uint64 highest_bid = 6;
  uint64 highest_bidder = 7;
  uint64 end_ms = 8;
  string state = 9;
  uint64 version = 10;
  string order_id = 11;
}
message AuctionLotResponse {
  TipInfoMessage error_message = 1;
  AuctionLotView lot = 2;
  uint64 server_now_ms = 3;
}
