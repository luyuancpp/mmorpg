syntax = "proto3";
option go_package = "scene";

import "proto/db/proto_option.proto";
import "proto/common/base/tip.proto";
import "proto/common/component/base_comp.proto";
import "proto/common/base/empty.proto";
import "proto/common/component/player_skill_comp.proto";
import "proto/common/component/actor_comp.proto";

option cc_generic_services = true;
option (OptionFileDefaultNode) = NODE_SCENE;

message ReleaseSkillRequest {
  uint32 skill_table_id = 1;
  uint64 target_id = 2; // 服务端下发的不透明 actor 网络号；0 表示无目标，不得填玩家 GUID 或本地 ECS 句柄。
  Vector3 position = 3;  
  Rotation rotation = 4;
}

message ReleaseSkillResponse {
  TipInfoMessage error_message = 1;  
}

message SkillInterruptedS2C
{
  uint64 entity = 1; // 施法者的不透明 actor 网络号。
  uint64 target_entity = 2; // 目标的不透明 actor 网络号；0 表示无目标。
  uint32 skill_table_id = 3;
  uint32 reason_code = 4;
  uint64 skill_id = 5;
}

message SkillUsedS2C
{
  uint64 entity = 1; // 施法者的不透明 actor 网络号。
  repeated uint64 target_entity = 2; // 目标的不透明 actor 网络号列表，不是玩家 GUID 或本地 ECS 句柄。
  uint32 skill_table_id = 3;
  Vector3 position = 4;
  uint64 time_stamp = 5;
}

// List skills request
message ListSkillsRequest {
}

// List skills response
// 3..6 是四职业技能书(2026-10-19,docs/design/class-skills.md §4):服务端按当前职业现算的完整目录 + 角色等级 + 余额。
// skill_list 仍是"已拥有"的原样列表(robot / 旧客户端只读它);catalog 只列当前职业的职业技能,未学的也在里面(rank = 0)。
message ListSkillsResponse {
  TipInfoMessage error_message = 1;  
  PlayerSkillListComp skill_list = 2;
  repeated SkillCatalogEntry catalog = 3;   // 按 skill_table_id 升序
  uint32 player_level = 4;
  uint32 class_id = 5;
  uint64 currency_balance = 6;              // 修习货币余额(CurrencySystem kCurrencyGold,客户端称"银两")
}

// 技能书的一行:配置表的展示投影 + 本角色的等级与可修习性。数值真源是 Skill 表与服务端规则,
// 客户端只展示,不得据此推算、也不回传这些派生值。
message SkillCatalogEntry {
  uint32 skill_table_id = 1;
  string name = 2;
  string description = 3;
  string icon_key = 4;            // Unity Resources 相对键,不带扩展名、不带 Assets/Resources/ 前缀(如 "UI/Skills/1101")
  uint32 class_id = 5;
  string category = 6;            // 表里的分类文案(主动 / 被动 …),只用于展示
  bool passive = 7;
  uint32 target_team = 8;         // 1 = 敌方,2 = 友方,3 = 自身(class_skill_rules.h TargetTeam)
  uint32 max_targets = 9;
  uint32 unlock_level = 10;
  uint32 max_rank = 11;
  uint32 rank = 12;               // 已学等级;0 = 未学
  uint32 rank_limit = 13;         // 按当前角色等级能修到的最高重;未到解锁等级为 0
  double mana_percent = 14;       // 耗蓝比例(0.03 = 最大法力的 3%,战斗内向上取整、至少 1)
  uint32 cooldown_rounds = 15;
  uint64 next_rank_cost = 16;     // 再修一重的价格;已满重为 0
  uint32 upgrade_block_tip_id = 17; // 0 = 现在可以修习一重;否则为不能修习的原因(tip 码,skill_error 段)
  uint32 duration_rounds = 18;    // 附带增益 / 减益的持续回合;没有为 0
}

// 修习(学习 = 从 0 升到 1)。修习者由服务端会话确定,请求里没有角色身份。
message UpgradeSkillRequest {
  uint32 skill_table_id = 1;
  uint32 expected_rank = 2;       // 客户端看到的当前等级;与服务端不一致整笔拒绝(旧请求重放不会再扣一次)
  uint32 count = 3;               // 只收 1 或 10;10 次在满重 / 等级上限 / 余额不足处提前停
}

message UpgradeSkillResponse {
  TipInfoMessage error_message = 1; // 整笔拒绝(一重都没修成)时才填;部分成功不填
  ListSkillsResponse state = 2;     // 处理完之后的完整技能书(拒绝时也带,客户端据此整体替换)
  uint32 upgraded_count = 3;        // 实际修成的重数
  uint32 stop_tip_id = 4;           // 少于 count 时的停止原因(tip 码);按请求次数全部修成为 0
}

service SceneSkillClientPlayer { 
  option (OptionIsPlayerService) = true;
  option (OptionIsClientProtocolService) = true;
  
  rpc ReleaseSkill (ReleaseSkillRequest) returns (ReleaseSkillResponse);
  rpc NotifySkillUsed (SkillUsedS2C) returns (Empty);
  rpc NotifySkillInterrupted (SkillInterruptedS2C) returns (Empty);
  rpc ListSkills (ListSkillsRequest) returns (ListSkillsResponse);
  rpc UpgradeSkill (UpgradeSkillRequest) returns (UpgradeSkillResponse);
}
