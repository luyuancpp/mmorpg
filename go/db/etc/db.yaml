Name: db.rpc
ListenOn: 0.0.0.0:6000
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: db.rpc
ZoneId: 1
ServerConfig:
  JsonPath: "../../generated/data/mysql_database_table_list.json"
  # Kafka config for the Kafka consumer
  Kafka:
    Brokers:
      - "127.0.0.1:9092" # Kafka broker address
    GroupID: "db_rpc_consumer_group" # 消费组(最终形状键);本机 go_services.ps1 -Zone N 追加 _zN,K8s 见下方注释
    # ── 消费组(docs/design/db-consumer-group-per-zone.md)────────────────────────
    # 上面这一行保持「GroupID: "<名>"」加行尾注释的形状:go_services.ps1 按这个形状给本机 -Zone N 启动追加 _zN
    # (不带 -Zone 的单 zone 默认启动保持裸名),dev_tools.ps1 / k8s_deploy.ps1 / k8s_zone_rollback.ps1 /
    # merge_zone 都拿这个值当推导 zone 组名 db_rpc_consumer_group_z<ZoneId> 的基名。
    # K8s 的 go-svc-db-config 由 k8s_deploy.ps1 渲染,只有四种形状:
    #   最终形状 final(G):只写 GroupID: "G",G 为 db_rpc_consumer_group 或 db_rpc_consumer_group_z<ZoneId>,任何版本都能加载;
    #   交接形状 handoff(X←Y):写 ConsumerGroup: "X" 与 GroupHandoffFrom: "Y",不写 GroupID(交接闸之前的二进制因此拒启)。
    # 下面五个键默认不写;需要时取消注释:
    # ConsumerGroup: "db_rpc_consumer_group_z1"  # 与 GroupID 二选一,只用于交接形状
    # GroupHandoffFrom: "db_rpc_consumer_group"  # 只能和 ConsumerGroup 一起用,且不能等于本组名;非空即启用交接闸
    # SessionTimeoutMs: 10000                    # 消费组会话超时;不写取 10000(sarama 默认)
    # HeartbeatIntervalMs: 3000                  # 心跳间隔;约束 HeartbeatIntervalMs x 3 <= SessionTimeoutMs
    # RebalanceTimeoutMs: 60000                  # 再平衡超时;约束 >= 15000(claim 收尾 10s + 提交余量 5s)
    # Topic and DBName are derived from ZoneId at startup (db_task_zone_{ZoneId}, zone_{ZoneId}_db)
    # Partition count is immutable within one generation. Expansion requires
    # an offline drain and a new generation in login/db together.
    TopicGeneration: 1
    PartitionCnt: 10 # ⚠️ MIRROR of go/login/etc/login.yaml Kafka.PartitionCnt.
                     # 两边不一致或 broker 已漂移时启动直接 fail-closed。
    IsOfflineExpand: false # Default false; dynamic expansion mode
    SubShardCount: 8 # 2026-05-28 stress §5: partition=10 × 1 worker per
                     # partition was the real throughput cap (not MySQL
                     # pool). SubShardCount=4 splits each partition's
                     # work across 4 goroutines (hash by Key, per-key
                     # ordering preserved), giving 10×4=40 effective
                     # parallelism and finally saturating MaxOpenConn=30.
                     # 2026-06-01 Round 14 §P5: after Round 14 P0 lifted
                     # EnterGame throughput +15% the db consumer→dispatch
                     # chain became the new bottleneck (preload_failed
                     # 0→3,663 @ t18m, cb_wait{ok} 85→275ms). Bump 4→8
                     # = 10×8=80 effective parallelism, paired with
                     # MaxOpenConn 30→60 below so MySQL pool stays the
                     # limiter we WANT (linear scaling) rather than the
                     # per-partition goroutine count.
  Database:
    Hosts: "127.0.0.1:3306"
    User: "root"
    Passwd: "Mmorpg#2026db"
    # ── 库名白名单(启动期硬断言)────────────────────────────────────
    # DBName 由 ZoneId 现拼(zone_{ZoneId}_db),而 ZoneId 是最容易填错的字段:
    # 填错一位就会在生产实例上静默建出新库、建全套表、把玩家数据写进去且无人
    # 看到报错。所以启动时会 SELECT DATABASE() 并要求它落在这份**与 ZoneId
    # 无关的外部清单**里,不在就拒启。
    # 解析优先级:环境变量 DB_ALLOWED_DATABASES > AllowedDatabasesFile > 本字段。
    # 生产部署请在 Deployment 上注入 DB_ALLOWED_DATABASES,不要依赖本文件。
    AllowedDatabases: []
    # AllowlistEnforcement=warn 表示「三个来源全空时打 WARN 放行」。
    # ⚠️ 本文件是**本地/dev 配置**(127.0.0.1 + MetricsListenAddr 都是 dev 默认),
    # 本地 go_services.ps1 会按 -Zone 改写 ZoneId,写死清单反而挡住多 zone 调试。
    # 生产配置一律不要带这一行(缺省即 strict = 拒启)。
    AllowlistEnforcement: warn
    # ── 启动期 DDL 开关(默认全关)──────────────────────────────────
    # 历史行为等价于两个都 true:InitDB() 会逐张跑 CreateOrUpdateTable。
    # 多 zone × 多副本同时启动会对同一张大表并发 ALTER,MDL 阻塞会让整个 zone
    # 的 db_task 消费停摆;proto2mysql 还会在类型不匹配时自动 MODIFY COLUMN,
    # 无版本记录、无 lock 超时。生产改为部署阶段跑:
    #     go run ./cmd/migrate -f etc/db.yaml -command up
    # 本地为了「起了就能用」保持 true;要临时回退线上行为可用环境变量
    # DB_AUTO_CREATE_DATABASE=1 / DB_AUTO_MIGRATE_SCHEMA=1 覆盖(见 README)。
    AutoCreateDatabase: false
    AutoMigrateSchema: false
    Migration:
      LockWaitSeconds: 5           # MDL 等待上限:撞上长事务时秒级失败,别堵死整表
      InnodbLockWaitSeconds: 5     # 行锁等待上限
      StatementTimeoutSeconds: 300 # 单条 DDL 硬超时,超时后旁路 KILL QUERY
      AdvisoryLockSeconds: 60      # GET_LOCK 等待:多副本同时部署时后到的排队
    # ── 业务连接池的超时与会话级锁等待(L-04,docs/design/db-task-store-unavailable-deferral.md §8)──
    # 本 zone 库与按需打开的落点库都用这组值;迁移入口(cmd/migrate)与建库不用(DDL 可能合法地跑几分钟)。
    # 不写或写 0 取默认值(即下面这几个数);写负数表示不设。K8s 的 ConfigMap 不写这几项,走默认值。
    # 会话级锁等待必须短于读超时:客户端读超时撤不回已经发出的语句,让服务端先以 1205 中止排队中的语句,
    # 超时之后才不会留下事后生效的在途写。本地打开 AutoMigrateSchema 时启动期建表 / 补列也走这个池,大表上可能撞读超时。
    DialTimeoutSeconds: 5
    ReadTimeoutSeconds: 30
    WriteTimeoutSeconds: 30
    SessionLockWaitSeconds: 10       # MySQL lock_wait_timeout(元数据锁);TiDB 是否接受未核实,不接受时写 -1
    SessionInnodbLockWaitSeconds: 10 # MySQL innodb_lock_wait_timeout(行锁)
    MaxOpenConn: 60 # 2026-05-28 deep-dive §1: 10 was the real bottleneck.
                    # partition=10 + MaxOpenConn=10 meant every worker
                    # competed for exactly one MySQL connection; under
                    # ~90 task/s steady input the pool was always full
                    # and Kafka backlog grew to 91k. 30 gave 3x headroom.
                    # 2026-06-01 Round 14 §P5: 30→60 to match
                    # SubShardCount 4→8 (10 partitions × 8 sub-shards
                    # = 80 effective workers, 60 connections keeps the
                    # pool the limiter).
                    # 2026-10-12 更正:以前这里写的「MySQL 默认 max_connections=151 留得出余量」不成立。
                    # K8s 上所有 zone 的 go/db、data_service、gateway 与全局的 friend、trade 共用同一台 MySQL,
                    # 本池 × 副本数(2)× zone 数是总账里最大的一项。改这个值必须重算总账:
                    # tools/scripts/k8s_deploy.ps1 的 Get-MysqlConnectionLedger(部署时打印 "MySQL connection ledger"),
                    # 契约测试钉住「规划峰值 ≤ deploy/k8s/manifests/infra/mysql.yaml 的 max_connections」。
    MaxIdleConn: 20 # raised from 3 to keep the warm-pool sized for the
                    # new MaxOpenConn — otherwise the pool churns
                    # connections under load. 2026-06-01 Round 14: 10→20
                    # tracks MaxOpenConn 30→60 so warm-idle stays at 1/3.
    Net: ""
  RedisClient:
    Hosts: "127.0.0.1:6379"
    DefaultTTLSeconds: 3600
    Password: ""
    DB: 0
  # ── 大字段三档闸(db_task 落库路径)──────────────────────────────
  # 上限按**设计期望**定,不是按 MEDIUMBLOB 的 16MB 定 —— 按 16MB 设等于没设,
  # 等它触发时单次存盘早就把 MySQL 往返 + Redis 写回一起拖垮了。
  # 玩家单个组件 blob 的设计量级是个位数 KB,256KiB 已留一到两个数量级余量。
  # 量的是**入库字节**:proto2mysql 把子消息 base64 后再入库,≈ 序列化字节 ×4/3。
  # 观测:db_blob_bytes{table,column} / db_blob_row_bytes{table} 两个 histogram
  #      (看 p99,不是 max)+ db_blob_guard_total{table,column,level} 计数。
  BlobGuard:
    MaxColumnBytes: 262144   # 256 KiB / 列
    MaxRowBytes: 1048576     # 1 MiB / 行(所有 blob 列之和)
    WarnRatio: 0.8           # 到 80% 打 WARN + counter,仍放行
    ReportOnly: false        # 超限拒写。灰度期可临时设 true 先只观测
    PerTable:
      # 快照天然就大,单独放宽;它不走 db_task 路径,这里只是把口径写明白。
      player_snapshot:
        MaxColumnBytes: 8388608
        MaxRowBytes: 8388608

# ── 玩家存储落点(docs/design/player-storage-placement.md §6)────────────────
# 每条读 / 写任务按 player:placement:{id}(落点记录)与 player:zone:{id}(home_zone)选库:
#   有记录 → 记录指向的库;无记录 → home_zone 的 zone 库;都没有 → 本 zone 库(旧语义)。
#   写任务的 home_zone ≠ 本 ZoneId → 进死信不落库(合服前的滞留写);记录冻结(搬库中)→ 延后重试。
# 整段可缺省,缺省 = 下面写出的值。启动日志 "placement:" 一行是核对依据。
Placement:
  # 允许按需打开 zone_{1..999999}_db / player_store_{>=1000000}_db 两个家族的库(不在上面的
  # 库名白名单里也行)。按需打开只 Ping + 只读 schema 闸,**从不建库**,白名单防「ZoneId 填错
  # 静默建新库」的语义不变。设 false 时,本 zone 库之外的每个落点库都必须写进白名单。
  AllowStoreFamilies: true
  # true = 没有落点记录的玩家一律 fail-closed(写进死信、读回失败)。
  # 打开顺序(§13,反了会出事):全部 login 已 Placement.PinOnCreate=true,且各 zone 已
  # `merge_zone -mode pin-placement` 钉完存量之后才能开。
  Required: false
  # 额外落点库(本 zone 库之外)的连接池,**每个库一个池**,按库所属家族分两个旋钮(本 zone 库仍用上面的 Database.MaxOpenConn):
  #   ZoneStore*    —— zone 家族库 zone_{1..999999}_db:冷缓存访客读、合服 pin 后的源区库。最坏情形每个实例会打开其余全部
  #                    zone 的库,预算随 zone 数平方增长(总账见 tools/scripts/k8s_deploy.ps1 Get-MysqlConnectionLedger)。
  #   NonZoneStore* —— 非 zone 落点库 player_store_{>=1000000}_db(Phase 2)。大部分玩家搬进来后它是瓶颈,按压测单独调大,
  #                    不连带放大访客池;调大前先重做总账规划档。
  # 旧键 ExtraStoreMaxOpenConn / ExtraStoreMaxIdleConn 仍认:新键没写时两类库都回落到它,新配置不要再写。
  ZoneStoreMaxOpenConn: 8
  ZoneStoreMaxIdleConn: 2
  NonZoneStoreMaxOpenConn: 8
  NonZoneStoreMaxIdleConn: 2
  # 额外落点库池里空闲超过这么多秒的连接即关闭(SetConnMaxIdleTime):冷库的池回到 0 条,不按 MaxIdleConn 常驻。
  # ConnMaxLifetime 仍是 5 分钟,本值大于 300 等于不生效。
  ExtraStoreConnMaxIdleSeconds: 60
  # 落点记录所在的 Redis = data_service 的 MappingRedis(player:zone 所在实例,DB 0)。
  # 不写 = 复用上面的 RedisClient(本地与 K8s 两者同实例同 DB 0)。两者不同时**必须**显式填:
  # 读错 Redis = 读不到任何记录与 home_zone,全员按本 zone 选库,被钉到别处的玩家会写错库。
  # 必须指向主节点,不能是只读副本:落库后复核(§6.3)读到的冻结若滞后于搬库工具的写,关不住 TOCTOU。
  # 能力标记 db:capability:zone:{ZoneId} 也写在这里:带 90s TTL、每 30s 心跳续写(合服 pin / 搬库工具据此确认
  # 本 zone 此刻正在跑新版 go/db;回退旧版后标记在 TTL 内自然消失)。
  # Redis:
  #   Hosts: "127.0.0.1:6379"
  #   Password: ""
  #   DB: 0

# Prometheus /metrics endpoint. Dev default; disable for prod by setting
# empty string. Exposes:
#   db_task_stage_seconds{stage,op}  - per-task sub-stage latency
#     (op_total | op_handler | cache_write | result_publish)
#   db_task_result_total{op,result}  - terminal task outcome counter
#   db_placement_guard_total{op,outcome} / db_placement_store_open_total{result} /
#   db_placement_open_stores          - 按落点选库(见上面 Placement 段;stale_topic 应恒 0,
#                                       frozen_deferred 持续上涨 = 搬库冻结未解除,应告警)
# Round 16 stress runs scrape :9160 alongside login :9101 and
# scene_manager :9150 to attribute the dataloader_preload_callback_wait
# 11.8 ms → 31.4 ms regression seen in Round 15.
MetricsListenAddr: ":9160"
