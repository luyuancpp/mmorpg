# Prometheus alert rules for the db_task Kafka partition contract (玩家存盘 DBTask 的读写分区契约)。
#
# 来源:docs/design/db-task-kafka-partition-contract.md(分区函数契约:key = 玩家 id 十进制,partition = CRC-32(key) mod N);
#       落码规格与发布顺序见 docs/handoff/godb-pipeline-impl-20261015/S3-partition-align-spec.md(rollout 第 4、5 步)。
# 指标定义:go/db/internal/metrics/metrics.go 的 task_producer_partition_total{op,verdict}(Prometheus 名
# db_task_producer_partition_total),由 go/db/internal/kafka/producer_partition_audit.go 在 ConsumeClaim 解码成功后
# 逐条核对、只计数不拒绝。op 取 read | write | other,verdict 取 ok | partition_mismatch | key_mismatch | invalid;
# 进程启动时(metrics.Start 暴露端点之前)以 0 建出全部 3×4=12 条序列,increase 能抓到第一次。
#
# Install as a PrometheusRule CR (kube-prometheus stack),与 owner-epoch-alerts.yaml 同法:
#   kubectl apply -n observability -f deploy/k8s/db-task-partition-alerts.yaml
#   回滚:kubectl delete -n observability -f deploy/k8s/db-task-partition-alerts.yaml
#
# 安装时机:写规则在 go/db 观测上线之后即可生效;读规则 DbTaskReadPartitionMismatch 必须等 login 全部滚到按契约
# 分区的版本之后才 apply(滚动期间旧版 login 的读按 sarama 默认 FNV 分区,必然不符,会误报)。
# 需要先上写规则时,可以先注释掉读规则再 apply,login 滚完后再放开。
#
# Scrape prerequisites:
#   - go/db 的 MetricsListenAddr 已配置(K8s 上由 tools/scripts/k8s_deploy.ps1 的 db ConfigMap 写 ":9160")。
#   - A ServiceMonitor or PodMonitor pointed at that port.
#   前提不满足时这些告警是哑的。
#
# Severity conventions(与 scene-manager-alerts.yaml 相同):
#   critical = pager, someone wakes up
#   warning  = next-business-hours channel
#   info     = dashboard annotation / trend signal
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: db-task-partition-alerts
  labels:
    app: db
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: db-task.partition-contract
      interval: 30s
      rules:
        # 有生产者破坏了写的分区契约。同一玩家的写一旦在新旧生产者之间换分区,游标里记录的分区就不可比,
        # 写会被判 orderingIncomparable 隔离进死信 —— 所以是 critical。
        - alert: DbTaskWritePartitionContractBroken
          expr: |
            sum by (namespace) (increase(db_task_producer_partition_total{op="write",verdict!="ok"}[10m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 有存盘写不守 db_task 分区契约"
            description: >-
              过去 10 分钟约 {{ $value | printf "%.0f" }} 条写任务的 Kafka key 或所在分区不符合契约(CRC-32(玩家 id 十进制) mod N)。
              处置:按 go/db 日志「DATA-ORDERING: db_task producer violated the partition contract」里的 topic、partition、kafkaKey 找出写入方
              (常见原因:误跑了旧版 data_stress、scene 构建改了 partitioner、librdkafka 升级改了默认值;每个进程每种 op 最多打 20 条)。
              同时看 db_task_dead_letter_total{reason="ordering_incomparable"} 是否在涨:那是已经被隔离进死信、不会自动落库的写。

        # 读不符:还有旧版 login 在跑(按 sarama 默认 FNV 分区),或者 login 回滚到了旧镜像。
        - alert: DbTaskReadPartitionMismatch
          expr: |
            sum by (namespace) (increase(db_task_producer_partition_total{op="read",verdict!="ok"}[30m])) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 有存盘读不守 db_task 分区契约"
            description: >-
              过去 30 分钟约 {{ $value | printf "%.0f" }} 条读任务的 Kafka key 或所在分区不符合契约,且已持续 30 分钟。
              多半还有旧版 login 在跑,或者 login 回滚到了旧镜像。读本身不写数据,但这些读与同一玩家的写不在同一分区,没有读后写屏障,
              冷登录可能读到旧档。按 go/db 日志「db_task read outside the partition contract」里的 topic、partition 核对 login 各副本的镜像版本。
