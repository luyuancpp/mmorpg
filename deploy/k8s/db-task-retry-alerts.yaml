# Prometheus alert rules for go/db retry / deferral / dead-letter (玩家存盘的延后、重试与死信)。
#
# 来源:docs/design/db-task-store-unavailable-deferral.md §3.7 / §3.8(L-04 第 1 批);
#       重试只交给分区属主(④)与重试 / 死信 / 毒消息入队的落盘确认(WAITAOF):docs/design/db-retry-owner-routing.md §11
#       (存盘管线 S1,与 L-04 的规则同在 db-task.retry-and-dead-letter 组);
#       db-task.ordering-lease 组:docs/design/db-task-pipeline-bottlenecks.md G1;
#       db-task.consumer-group-handoff 组:docs/design/db-consumer-group-per-zone.md。
# 指标定义:go/db/internal/metrics/metrics.go(task_deferred_total / task_dead_letter_total /
# task_read_abandoned_total / retry_queue_length / store_cooldown_stores;
# ④ 与 WAITAOF:retry_route_total / owned_partitions / retry_routing_mode / durable_enqueue_total / claim_acquired_total,
# retry_queue_length 另有 queue="partitioned"(各 p{N} 之和);同一批的 ordering_lock_busy_total 与
# durable_enqueue_seconds 只进看板、不设告警;R7 复核新增 retry_stranded_receipts(无 label,每个 Pod 一份)与
# consumer_group_errors_total{source=heartbeat|partition|claim},后者只对 heartbeat 设 info 告警,partition / claim 只进看板;
# consumer_group_handoff_waiting_seconds / consumer_group_handoff_gate_total / consumer_group_handoff_total /
# consumer_group_handoff_conflict_total,同一批的 consumer_group_rebalance_gap_seconds 与
# consumer_group_handoff_wait_seconds 两个直方图只进看板、不设告警);
# go/db/internal/metrics/pipeline.go(ordering_lock_release_total / ordering_lease_lost_total /
# ordering_lease_renew_retry_total)。
# G1 的排序锁租约是治标,不是栅栏:它只缩小「失租后旧写晚于新写落库」的窗口,撤不回已经进了 MySQL 的语句;
# 根治靠 MySQL 条件写(docs/design/db-write-fencing-mysql.md)。
#
# Install as a PrometheusRule CR (kube-prometheus stack),与 owner-epoch-alerts.yaml 同法:
#   kubectl apply -n observability -f deploy/k8s/db-task-retry-alerts.yaml
#
# Scrape prerequisites:
#   - go/db 的 MetricsListenAddr 已配置(K8s 上由 tools/scripts/k8s_deploy.ps1 的 db ConfigMap 写 ":9160")。
#   - A ServiceMonitor or PodMonitor pointed at that port.
#   前提不满足时这些告警是哑的;上线检查见 docs/ops/godb-pipeline-launch-todo.md。
#
# 口径:
#   - ready、partitioned(按原始分区拆开的 kafka:retry:queue:{topic}:p{N} 之和)与 dead 是同一个 db_task topic
#     所有 go/db 实例共用的 Redis 列表,每个副本报的是同一个数,所以按 namespace(一个 zone 一个 namespace)取 max,不求和;
#     ready 与 partitioned 互不重叠,DbTaskRetryQueueGrowing 先按 pod 相加再取 max。S1 之前的 Pod 不报 partitioned。
#   - 计数器在进程启动时就以 0 建出全部 reason 的序列,increase 能抓到第一次。排序锁租约(pipeline.go registerPipeline)
#     与交接闸(metrics.go register)的计数器同样在 metrics.Start 暴露端点之前以 0 建出全部取值;④ 与 WAITAOF 的
#     计数器(retry_route 2×6、durable_enqueue 2×4、claim_acquired)也一样;R7 新增的 consumer_group_errors 三个 source 以 0 建出,
#     retry_stranded_receipts 以 0 设值。db_retry_queue_length 例外:重试循环每拍采样后才有。
#   - db_retry_routing_mode 每个 S1 版 Pod 恰好两条序列(mode=shared|owner,生效的为 1、另一条为 0),S1 之前的 Pod 没有:
#     DbRetryPartitionedStranded 只看有没有这条指标的序列,DbZoneNoPartitionClaims 数 mode="owner" 的序列条数(一条 = 一个 S1 版 Pod),
#     都不看取值。
#   - 按 pod 聚合与匹配(by / on (namespace, pod))用的是 ServiceMonitor / PodMonitor 默认附加的 namespace、pod 标签;
#     改用按注解抓取的 job 时 relabel 必须同样写出这两个标签,否则按 pod 的聚合会塌成按 namespace。
#   - 交接闸的等待时长 db_consumer_group_handoff_waiting_seconds 是每个 Pod 一份的 gauge,按 namespace 取 max。
#   - 本批没有死信重放工具(设计稿 §4.1,第 2 批)。在它落地之前死信告警定为 warning,处置方式写在 description 里。
#
# Severity conventions(与 scene-manager-alerts.yaml 相同):
#   critical = pager, someone wakes up
#   warning  = next-business-hours channel
#   info     = dashboard annotation / trend signal
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: db-task-retry-alerts
  labels:
    app: db
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: db-task.retry-and-dead-letter
      interval: 30s
      rules:
        # 写任务正在因为存储问题延后:MySQL 在落后于 Redis 里的在线数据。持续不退就说明库没恢复。
        # 只看写:读任务遇到存储不可用时立即回失败回执,不延后。
        - alert: DbTaskDeferredByStore
          expr: |
            sum by (namespace, reason) (
              rate(db_task_deferred_total{op="write", reason=~"conn_refused|conn_lost|store_readonly|store_busy|store_cooldown|store_open_failed"}[5m])
            ) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 的存盘因存储问题延后({{ $labels.reason }})"
            description: >-
              过去 5 分钟写任务以每秒约 {{ $value | printf "%.2f" }} 条的速率因 {{ $labels.reason }} 延后。
              这些写不耗重试预算,会一直留在 Redis 的 kafka:retry:queue:{topic} 与按分区的 kafka:retry:queue:{topic}:p{N} 里等库恢复;
              在库恢复之前,不要重启或清空这台 Redis —— 它们只在那里有一份。
              conn_refused = 连接数满(查 MySQL Threads_connected 与 mysql-connection-alerts.yaml);
              conn_lost / store_cooldown = 连不上(查 MySQL 是否在重启、网络);store_readonly = 只读(主从切换);
              store_busy = 锁等待超时 / 死锁 / TiDB 写冲突(查长事务与 DDL)。

        # 探活确认整库不可达,进入冷却。期间该库上的写全部延后,读立即失败。
        - alert: DbStoreCoolingDown
          expr: |
            sum by (namespace, pool) (db_store_cooldown_stores) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 的 go/db 判定 {{ $labels.pool }} 类库不可达"
            description: >-
              {{ $value }} 个 {{ $labels.pool }} 类的库被探活确认连不上,go/db 已停止向它发 SQL(每约 5 秒探活一次)。
              存盘在延后,不会丢;需要读库的冷登录会直接失败。查 MySQL 是否在重启、网络是否可达。

        # 有新任务进了死信。三类围栏隔离由 owner-epoch-alerts.yaml 的 critical 单独报,避免先收到低级别重复告警。
        # fence_evidence_conflict 是延后原因;耗尽预算后的 budget_exhausted 仍由本规则报。
        - alert: DbTaskDeadLetterAdded
          expr: |
            sum by (namespace, reason) (increase(db_task_dead_letter_total{reason!~"fence_stale_owner|fence_legacy_after_seq|owner_epoch_regressed"}[10m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 有任务进了死信({{ $labels.reason }})"
            description: >-
              过去 10 分钟约 {{ $value | printf "%.0f" }} 条任务进了 kafka:dead:queue:{topic}(原因 {{ $labels.reason }})。
              本批没有死信重放工具。处置:保留现场,不要清空列表;按 go/db 日志里含 dead queue / quarantined 的行归因;上报负责人。
              不要用 redis-cli 把条目搬回 ready:budget_exhausted 的条目里重试次数已满,下一拍认领时会被立刻送回死信。

        # 死信里有存量。上线前请先记录各 zone 的存量(LLEN),否则存量环境部署后会一直处于告警态。
        - alert: DbTaskDeadLetterNonEmpty
          expr: |
            max by (namespace) (db_retry_queue_length{queue="dead"}) > 0
          for: 1h
          labels:
            severity: info
          annotations:
            summary: "{{ $labels.namespace }} 的死信列表非空"
            description: >-
              kafka:dead:queue:{topic} 里有 {{ $value }} 条。它不会自己变空;处置方式同 DbTaskDeadLetterAdded。

        # 重试队列排不动:库长期不可用,或者重试本身在失败。ready 与 p* 里每条都是一整行玩家数据,Redis 内存在涨。
        # 先按 pod 把 ready 与 partitioned 相加(两者互不重叠),再按 namespace 取 max(每个副本报的是同一个数):
        # S1 之前的 Pod 不报 partitioned,照样按 ready 计入;混跑时取到的是新版 Pod 的 ready + p*。
        # 阈值待压测确认(docs/ops/godb-pipeline-launch-todo.md)。
        - alert: DbTaskRetryQueueGrowing
          expr: |
            max by (namespace) (sum by (namespace, pod) (db_retry_queue_length{queue=~"ready|partitioned"})) > 1000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的重试队列持续积压"
            description: >-
              kafka:retry:queue:{topic} 与按分区的 kafka:retry:queue:{topic}:p{N} 合计已有 {{ $value }} 条且 10 分钟没有降下来。
              先看 DbTaskDeferredByStore / DbStoreCoolingDown 是否同时在响;都没响时按 db_task_deferred_total 的 reason 查原因。
              去掉聚合分别查 queue="ready" 与 queue="partitioned":积压主要在 p* 时,同时看 DbRetryPartitionedNoProgress /
              DbZoneNoPartitionClaims / DbRetryPartitionedStranded。
              同时核对共享 Redis 的内存余量。

        # ── 重试只交给分区属主(④)与入队落盘确认(WAITAOF),docs/design/db-retry-owner-routing.md §11 ──
        # mode / action / queue / target / result / pool 的取值必须与 go/db/internal/metrics/metrics.go 的 RetryMode* / RetryRoute* /
        # RetryQueue* / DurableTarget* / Durable* / PoolHome 常量逐字一致,改常量同改这里(写错取值的表达式不报错,只会永远不响;
        # 写在 unless 里的则是永远不抑制)。
        # 本节没有另开 group:原规格写明与 L-04 的规则「同组」,修订稿 §6 未改分组。

        # p* 连续 15 分钟不空,且本 namespace 没有任何重试被派发执行。executed 与 executed_nonowner 都算进展
        # (shared 实例兜底排空 p* 时,没有该分区 claim 的记后者)。
        # 第二个 unless:本 zone 主库(pool="home";go/db 的 homeStoreCoolingDown 只查 ZoneId 那一个库)冷却时,shared 与 owner
        # 两种模式都整拍不认领重试(owner 仍把共享收件箱分拣进 p*,记 forwarded,不算进展),属预期,冷却本身由 DbStoreCoolingDown 报。
        # 只按 home 抑制、不按任意库:额外落点库(extra_zone / extra_non_zone)冷却时重试照常认领,派发即记 executed,不会让本条误报;
        # 按任意库抑制,合服源区库或非 zone 落点库长时间不可达时会把「owner 失踪 / 误回滚旧镜像」一直压住。
        # 修订稿 §6 原文是 sum by (namespace) (db_store_cooldown_stores) > 0(不带 pool),此处按代码口径收窄。
        # "home" 必须与 go/db/internal/metrics/metrics.go 的 PoolHome 逐字一致:写错时第二个 unless 永远不生效,主库冷却期间本条误报。
        - alert: DbRetryPartitionedNoProgress
          expr: |
            (min_over_time((max by (namespace) (db_retry_queue_length{queue="partitioned"}))[15m:1m]) > 0)
            unless on (namespace) (sum by (namespace) (increase(db_retry_route_total{action=~"executed|executed_nonowner"}[15m])) > 0)
            unless on (namespace) (sum by (namespace) (db_store_cooldown_stores{pool="home"}) > 0)
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的按分区重试 p* 15 分钟不空且无人执行"
            description: >-
              按原始分区拆开的重试 kafka:retry:queue:{topic}:p{N} 过去 15 分钟一直不空(15 分钟内的最小值约 {{ $value }} 条),
              而本 namespace 没有任何 go/db 派发过一条重试(executed / executed_nonowner 都没有增长),本 zone 主库(pool=home)也不在冷却
              (主库冷却时 shared 与 owner 两种模式都整拍不认领重试,owner 仍分拣,属预期,不报本条;额外落点库冷却不抑制本条)。
              查 owner 实例是否还在、是否持有分区(DbZoneNoPartitionClaims 是否同时在响,去掉聚合按 pod 查 db_owned_partitions);
              查是否误回滚到 S1 之前的镜像(该镜像看不到 p*,不上报 db_retry_routing_mode,同时看 DbRetryPartitionedStranded)。
              处置用 go/db/cmd/retry_requeue,步骤见 DbRetryPartitionedStranded。
              局限:按 namespace 聚合,看不到单个分区卡住 —— 只要别的分区的重试在执行,本条就不响。
              单个分区的属主卡住时,该分区的 Kafka 消费也会一起停(重试与新消息走同一个 worker),同时看该分区的 Kafka lag 与 DbZoneNoPartitionClaims。

        # p* 里有存盘,而本 namespace 已没有任何能处理 p* 的实例:S1 之前的镜像只认共享收件箱、看不到 p*,db 全停时同样无人处理。
        # 不依赖任何新版二进制在线:只用 Prometheus 里新版 Pod 退出前留下的最后样本。取「最后一次上报时间最晚」的那个 Pod 的
        # 最后值(timestamp() 子查询 + topk by (namespace)),不能简化成 max:早先退出的 Pod 留下的旧非零值会误报。
        # 窗口 6h(Prometheus 默认保留 15d,够用)。紧急回滚之后约 10 分钟内响(序列过期 5m + for 5m)。
        - alert: DbRetryPartitionedStranded
          expr: |
            (
              max by (namespace) (
                last_over_time(db_retry_queue_length{queue="partitioned"}[6h])
                and on (namespace, pod)
                topk by (namespace) (1, last_over_time(timestamp(db_retry_queue_length{queue="partitioned"})[6h:1m]))
              ) > 0
            )
            unless on (namespace) (count by (namespace) (db_retry_routing_mode) > 0)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 的按分区重试 p* 滞留,本 zone 没有能处理它的 go/db"
            description: >-
              最后一个上报的新版 go/db 退出时 kafka:retry:queue:{topic}:p* 里还有 {{ $value }} 条,而当前 namespace 没有任何能处理 p* 的实例
              (没有一条 db_retry_routing_mode 序列:全是 S1 之前的镜像,或 db 全停),这些存盘不会自动落库;它们在 Redis 里只有这一份,不要重启或清空这台 Redis。
              db 全停、之后拉起的仍是 S1 及以后的镜像时,拉起即可(shared 实例每拍兜底排空 p*,owner 实例处理自己持有分区的 p{N})。
              否则先确认本 zone 每个 go/db 都是 S1 之前的镜像或 RetryRouting=shared(owner 实例会把收件箱重新分拣回 p*),再用 go/db/cmd/retry_requeue
              (工作目录 go/db;-zone 必填:R7 之前缺省取配置文件里的 ZoneId,漏了会盘点别的 zone 并以 0 退出;现在不给 -zone 直接以退出码 1 退出,一条不动):
              先 go run ./cmd/retry_requeue -f etc/db.yaml -zone <zone> -check(只读盘点;连 K8s 上的 Redis 加 -redis / -redis-db / -redis-password-env,
              口令只经环境变量;该 zone 的代次与本地配置不同时加 -topic-generation),按退出码判断:0 = p* 全 0;3 = p* 非 0;
              4 = 目标看起来没在用(登记表为空、所有重试列表都是 0,多半是 -f / -zone / -topic-generation / -redis / -redis-db 指错,只有该 zone 的 go/db 全停时才加 -allow-empty-target);
              5 = 登记表里还有登记为 owner 模式的实例(先切 shared 并等滚动完成);1 = 参数 / 配置 / Redis 出错。
              退出码 5 只看得见会登记模式的 go/db,三项人工核对仍要做:各 db Pod 的 db_retry_routing_mode{mode="owner"} 为 0;
              kubectl -n {{ $labels.namespace }} set env deploy/db --list 里没有 DB_RETRY_ROUTING=owner;rollout status deploy/db 已完成。
              再去掉 -check 执行搬回共享收件箱 kafka:retry:queue:{topic}(同样过 4 / 5 两道门,可重入);搬完它会再盘点一次,p* 仍非 0 时以 3 退出,0 才算搬完。
              局限:本条只看 Prometheus 里 6h 内的最后样本。搬回之后窗口内本条仍会响,以 -check 退出码 0 为准并静默;
              窗口过后本条会自行消失,但这不代表已处理,只能以 retry_requeue -check 的结果为准(回滚前置见 docs/ops/release-checklist.md)。

        # 本 zone 所有 S1 版 go/db 都没有存活的分区 claim(db_owned_partitions 之和为 0):存盘消费停了;owner 模式下重试也一起停滞
        # (owner 模式不设 shared 兜底,docs/design/db-retry-owner-routing.md §3 / §6)。claim 租约在两种模式下都登记,shared 模式同样会报。
        # unless 子句:仍有 S1 之前的 Pod 时抑制 —— 旧 Pod 上报 queue="ready"、不上报 db_retry_routing_mode,ready 序列条数多于
        # mode="owner" 序列条数(每个 S1 版 Pod 恰好一条,与取值无关)就说明在混跑,旧 Pod 可能正持有分区而本表达式看不见。
        # 再平衡与切组发布中途的短暂为 0 由 for 5m 吸收;db 全停时没有任何序列,本条不响(p* 滞留由 DbRetryPartitionedStranded 报)。
        - alert: DbZoneNoPartitionClaims
          expr: |
            (sum by (namespace) (db_owned_partitions) == 0)
            unless on (namespace)
              (count by (namespace) (db_retry_queue_length{queue="ready"}) > count by (namespace) (db_retry_routing_mode{mode="owner"}))
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 的 go/db 没有任何实例持有 db_task 分区"
            description: >-
              本 namespace 每个 S1 版 go/db 都没有存活的分区 claim,已持续 5 分钟:存盘消费停止、积压在 Kafka 里,需要读库的冷登录会超时;
              RetryRouting=owner 时 p* 里的重试也只进不出(数据都在 Redis 里,不丢)。
              查 Kafka broker 是否可达、本 zone 消费组的 describe(成员与分区分配)、S2 交接闸日志(go/db 日志「group handoff waiting」,
              同时看 DbConsumerGroupHandoffWaiting / DbConsumerGroupHandoffStuck)。
              处置:先修 Kafka 或交接闸。交接闸卡住、broker 可达且 MySQL 健康时,可以
              kubectl -n {{ $labels.namespace }} set env deploy/db DB_RETRY_ROUTING=shared 触发滚动,由 shared 实例排空 p*(恢复后用 DB_RETRY_ROUTING- 去掉覆盖);
              broker 不可达时不要这么做:新 Pod 在建消费组(NewConsumerGroup)处起不来,滚动卡住。见 docs/design/db-retry-owner-routing.md §3 / §6。

        # zone 里已有 owner 实例,仍有 shared 实例在执行非属主重试:混跑未收口,或环境变量 DB_RETRY_ROUTING 的覆盖残留。
        # 按构造 owner 实例自身不会计 executed_nonowner。shared ↔ owner 的切换滚动中途会响,属预期:滚动结束后 shared 实例退出,
        # 10 分钟窗口过后自行消失;滚动结束 10 分钟后仍在响才需要处置。
        # 取值只在启动时读:改了 ConfigMap 的 RetryRouting 却没有 rollout restart 时,只有重启过的 Pod 读到新值,同样会混跑。
        - alert: DbRetryNonOwnerExecutionInOwnerZone
          expr: |
            sum by (namespace) (increase(db_retry_route_total{action="executed_nonowner"}[10m])) > 0
            and on (namespace) (max by (namespace) (db_retry_routing_mode{mode="owner"}) == 1)
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 已有 owner 实例,仍有 go/db 在执行非属主重试"
            description: >-
              过去 10 分钟约 {{ $value | printf "%.0f" }} 条重试由不持有其原始分区 claim 的 shared 实例执行(executed_nonowner),
              而本 namespace 已有 RetryRouting=owner 的实例。可能是:切换滚动没做完;改了 ConfigMap 的 RetryRouting 却没有 rollout restart
              (取值只在启动时读,只有重启过的 Pod 读到新值);或 DB_RETRY_ROUTING 环境变量覆盖残留。
              这些重试照旧在排序锁、游标与 epoch 守卫之下执行(同 shared 语义),但 owner 模式要消除的跨实例抢锁还在。
              去掉聚合按 pod 查 db_retry_routing_mode,核对各 Pod 启动日志「retry routing: mode=… source=…」(source 标出取值来自配置还是环境变量)
              与 Deployment 的 env;定下目标模式后,配置漂移用 kubectl -n {{ $labels.namespace }} rollout restart deploy/db 收口,
              环境变量覆盖用 kubectl -n {{ $labels.namespace }} set env deploy/db DB_RETRY_ROUTING- 去掉(同样会触发滚动)。

        # claim 撤销后把重试原样搬回 p{origin}(requeued_revoked),而 10 分钟内本 namespace 没有登记任何新 claim
        # (db_claim_acquired_total 不涨):撤销不像是再平衡引起的。用计数器而不用 changes(db_owned_partitions):
        # 抓取间隔内完成的同数量再平衡,gauge 看不出变化,会漏报。
        - alert: DbRetryRevokedOutsideRebalance
          expr: |
            sum by (namespace) (increase(db_retry_route_total{action="requeued_revoked"}[10m])) > 0
            unless on (namespace) (sum by (namespace) (increase(db_claim_acquired_total[10m])) > 0)
          for: 0m
          labels:
            severity: info
          annotations:
            summary: "{{ $labels.namespace }} 有重试因 claim 撤销被搬回,同期没有再平衡"
            description: >-
              过去 10 分钟约 {{ $value | printf "%.0f" }} 条重试因 claim 撤销被原样搬回 kafka:retry:queue:{topic}:p{origin}(requeued_revoked),
              而同期本 namespace 没有登记任何新的分区 claim(db_claim_acquired_total 没有增长)。搬回不执行、不耗重试预算,存盘不丢。
              偶发可忽略;持续出现时按 go/db 日志查 claim 为何结束,并看 DbZoneNoPartitionClaims(撤销之后再没拿到分区)是否也在响。

        # Kafka 源任务的唯一副本(失败入重试、隔离进死信、毒消息)在 Kafka 位点提交之前写进 Redis,没拿到落盘确认或写入失败。
        # canceled(停机或调用方 ctx 取消,每次滚动重启都会涨)不计入,只看 not_durable 与 error。
        - alert: DbDurableEnqueueNotConfirmed
          expr: |
            sum by (namespace, target, result) (increase(db_durable_enqueue_total{result=~"not_durable|error"}[5m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 的 go/db 入队未确认落盘(target={{ $labels.target }},result={{ $labels.result }})"
            description: >-
              过去 5 分钟约 {{ $value | printf "%.0f" }} 次把 Kafka 源任务的唯一副本写进 Redis 时没有确认(target={{ $labels.target }}:
              retry = kafka:retry:queue:{topic} 或其 p{N},dead = kafka:dead:queue:{topic};result={{ $labels.result }})。canceled(停机)不计入本条。
              未确认时 Kafka 位点不提交,该 claim 失败并从未确认的 offset 起重投,存盘不丢,但该分区停滞,直到 Redis 重新确认。
              not_durable = 组提交在单批预算(5s)内没有拿到足够的 WAITAOF 确认。它也可能是 Redis 不可达或网络分区
              (组提交路径上网络错误重试到预算用尽同样计 not_durable),不只是 AOF / fsync 慢。
              error = LPUSH / WAITAOF 被确定性拒绝、WAITAOF 回复形状不对,或关闭 WAITAOF 时 4 次 LPUSH 全部失败(这条路径上网络错误计 error)。
              查 Redis 的 AOF / fsync(INFO persistence、磁盘延迟)、go/db 到 Redis 的连通性与副本状态;go/db 日志搜「DATA-LOSS PREVENTED」。
              不要靠关掉 WAITAOF(WaitAOFNumLocal / WaitAOFNumReplicas 写 0)来止血,除非负责人同意。
              未确认时 LPUSH 早已生效,重投时会再推一份:事故期间死信(target=dead,队头是毒消息等确定性进死信的消息时每个周期一份)会积累字节相同的副本,
              重试队列里的同 seq 副本由游标吸收。重新入组退避(1s 起翻倍、封顶 30s,go/db 日志「consumer group rejoin delayed」)只限速,副本数没有硬上界;
              事后处置死信时按 (topic, partition, offset) 去重(或按 taskID),不要把副本当成多笔不同的存盘。

        # 本 Pod 有已认领进自己 processing 的重试收据,出口搬移(claim 撤销后搬回 p{origin}、misrouted 挪回原分区、失败写回 ready、进死信)
        # 因 Redis 出错一直没搬成(go/db/internal/kafka/retry_stranded.go)。gauge 无 label、每个 Pod 一份,所以按 pod 报。
        # 重试协程约每秒一拍,在分拣与认领之前重搬(每拍最多 100 条),Redis 恢复后很快归零;for 10m 只报持续拒绝。
        - alert: DbRetryStrandedReceipts
          expr: |
            max by (namespace, pod) (db_retry_stranded_receipts) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} 有重试收据搬不走,滞留在本实例 processing"
            description: >-
              {{ $labels.pod }} 有 {{ $value }} 条重试收据已认领进它自己的 processing 列表 kafka:retry:processing:{topic}:{实例名},
              出口搬移(撤销搬回 p{origin} / misrouted / 失败写回 / 进死信)因 Redis 出错持续 10 分钟没搬成。搬成之前这些存盘不会执行;
              本实例一直续租,别的实例不会回收它们。owner 重试的 Kafka 位点早已提交,收据是那笔存盘在 Redis 里唯一的副本:不要清空这台 Redis,不要手工删 processing。
              先按 go/db 日志「stranded retry receipt still cannot be moved」里的 dest / err 查原因(Redis 不可用、目的键类型不对等)并修好。
              仍不归零时重启该 Pod:kubectl -n {{ $labels.namespace }} delete pod {{ $labels.pod }}(由 Deployment 拉起新 Pod),
              或 kubectl -n {{ $labels.namespace }} rollout restart deploy/db 整体滚动。正常停机时 release 把本实例 processing 整表还回共享收件箱
              kafka:retry:queue:{topic}(go/db 日志「returned … unfinished retry receipts to the ready queue on shutdown」;失败写回里更新过的重试次数随之丢失,这一次尝试不计);
              release 本身也要写 Redis,失败或进程被强杀时,这些收据等租约过期后由别的实例回收。重启之后核对该实例名下的 processing 已空。

        # 本 Pod 的 sarama 消费组错误通道收到组级错误(source="heartbeat":心跳、找 coordinator;go/db/internal/kafka/consumer_group_errors.go)。
        # 它对应 retry_routing.go 文件头写的双属主窗口:coordinator 可能已把本成员逐出、分区交给了别人,本进程还没察觉。
        # R7 复核把它列为可选;定为 info,不呼人。source="partition"(位点提交或拉取)与 source="claim"(ConsumeClaim 返回的错误)只进看板。
        - alert: DbConsumerGroupHeartbeatErrors
          expr: |
            sum by (namespace, pod) (increase(db_consumer_group_errors_total{source="heartbeat"}[10m])) > 0
          for: 0m
          labels:
            severity: info
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} 的 go/db 消费组心跳 / coordinator 出错"
            description: >-
              过去 10 分钟 {{ $labels.pod }} 的消费组错误通道收到约 {{ $value | printf "%.0f" }} 条组级错误(source=heartbeat:心跳或找 coordinator 失败)。
              这时 coordinator 可能已在 Session.Timeout(10s)后把本成员逐出、把分区交给别的成员,而本进程要过约 Net.ReadTimeout(sarama 缺省 30s)
              到 (Metadata.Retry.Max+1)×Net.ReadTimeout 才察觉:这段双属主窗口里本实例的 claim 与租约仍然存活,RetryRouting=owner 时它仍从 p{N} 认领执行,
              与新属主并发;正确性只靠排序锁与 applied 游标兜底(与 shared 模式相同),两边都计 executed,DbRetryNonOwnerExecutionInOwnerZone 看不见。
              偶发(broker 滚动、coordinator 迁移)可忽略;持续出现时查本 Pod 到 coordinator 所在 broker 的网络与 broker 负载,
              按 go/db 日志「kafka consumer group error: source=heartbeat」定位时段,并看同一时段 DbOrderingLockReleasedNotOwned / DbOrderingLeaseLost 是否也在响。

    # G1 排序锁租约(go/db/internal/kafka/ordering_lease.go;组名被 ordering_lease.go 文件头注释逐字引用,
    # metrics/pipeline.go 的注释指向本文件,改组名同改两处)。
    # 这是治标,不是栅栏:只缩小窗口,撤不回已经进了 MySQL 的语句;根治靠 MySQL 条件写(docs/design/db-write-fencing-mysql.md)。
    # db_ordering_lease_renew_retry_total(续租失败后在租约预算内的重试)只进看板、不设告警:它持续上涨说明 Redis 抖动在吃
    # 租约余量,真正失租时由 DbOrderingLeaseLost 报。
    - name: db-task.ordering-lease
      interval: 30s
      rules:
        # 释放排序锁时锁已不归本实例(已过期或被别的实例接手)。持锁期间别的实例可能已写下更新的版本,
        # 本实例的整行写可能晚于它落库,所以是 critical。
        - alert: DbOrderingLockReleasedNotOwned
          expr: |
            sum by (namespace) (increase(db_ordering_lock_release_total{outcome="not_owner"}[10m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 的 go/db 释放排序锁时锁已不归本实例"
            description: >-
              过去 10 分钟约 {{ $value | printf "%.0f" }} 次释放排序锁时发现锁已过期或被别的实例接手(not_owner)。
              持锁期间别的实例可能已经写下该玩家更新的版本,本实例的整行写可能晚于它落库,MySQL 可能停在旧档,直到该玩家下一次存盘。
              排序租约(续租看门狗、写 SQL 前复核截止时间、令牌发布与推进脚本)只缩小窗口,不能撤回 SQL;持久化防线另由 MySQL 条件写提供。
              处置:按 go/db 日志「ordering lock already expired or taken over at release」里的 key / msgType 抽样核对 MySQL 行与 Redis PlayerAllData;
              日志里 sqlStarted=false 的条目没有发过 SQL,不涉及 MySQL 回档。
              同时查同一时段的 Redis 延迟、节点或虚拟机暂停,以及 DbOrderingLeaseLost 是否也在响。

        # 排序锁失租。失租的写不回写共享缓存、不推进游标,按 lease_lost 延后重试;SQL 在途时被取消的,锁留给 TTL。
        - alert: DbOrderingLeaseLost
          expr: |
            sum by (namespace, reason) (increase(db_ordering_lease_lost_total[10m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的 go/db 排序锁失租({{ $labels.reason }})"
            description: >-
              过去 10 分钟约 {{ $value | printf "%.0f" }} 次排序锁失租(原因 {{ $labels.reason }})。
              失租后这条写被取消或作废,记为 db_task_deferred_total 的 lease_lost 延后重试(照旧耗重试预算):失租在 SQL 之前则一条 SQL 都不发,在 SQL 之后则不回写共享缓存、不推进游标。
              SQL 已在途时被取消的,释放阶段不删锁,锁留给 TTL(2 分钟)过期,该玩家的存盘最多排队约 2 分钟(go/db 日志「ordering lock kept until TTL」)。
              owner_changed = 续租、older_seq 核锁、令牌发布或游标推进脚本发现锁已不归本实例(脚本返回 0;同时留意 DbOrderingLockReleasedNotOwned);
              renew_exhausted = Redis 续租连续失败到上限(10 次);renew_deadline = 到本地截止时间(锁最早可能过期的时刻减 30s 余量)仍没有续租成功;
              verify_error = older_seq 核锁调用失败,或令牌发布 / 推进脚本的 Redis 往返失败。
              租约本身不是栅栏:已经进了 MySQL 的语句撤不回;持久化防线另由 MySQL 条件写提供。
              查同一时段的 Redis 延迟与可用性、节点或虚拟机暂停,以及 db_ordering_lease_renew_retry_total 是否在涨。

    # 消费组按 zone 拆分的不停服交接闸(go/db/internal/kafka/group_handoff.go;组名被 metrics.go 的注释引用)。
    # 只在交接形状(ConfigMap 写 ConsumerGroup + GroupHandoffFrom)下有值;最终形状(只写 GroupID)不建交接闸,序列恒为 0。
    # result / outcome 的取值必须与 metrics.go 的 HandoffSeed* / HandoffGate* 常量逐字一致,改常量同改这里
    # (写错取值的表达式不报错,只会永远不响)。
    # no_offsets(两组都没有位点,从 oldest 起步)不设告警:全新 topic 首启与从未写入的分区都属正常。
    - name: db-task.consumer-group-handoff
      interval: 30s
      rules:
        # 交接闸放行前,被闸住的 Pod 不入本组、不持有分区。gauge 本身就是已等待的时长,不再加 for。
        # 切组(正向或反向交接)的那次滚动发布里,第一个新 Pod 要等本 zone 最后一个跑对方组的旧 Pod 退出才放行:两副本时
        # 每个新 Pod Ready 后还要再等 minReadySeconds(20s)才停下一个旧 Pod,按此估算要等 1 分钟以上(未实测),
        # 本条会在发布中途响一次,属预期。之后的发布里对方组已不再持有本 topic,闸会很快放行。
        - alert: DbConsumerGroupHandoffWaiting
          expr: |
            max by (namespace) (db_consumer_group_handoff_waiting_seconds) > 45
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的 go/db 在消费组交接闸前等待超过 45 秒"
            description: >-
              已在交接闸前等待约 {{ $value | printf "%.0f" }} 秒。被闸住的 Pod 不入本组、不消费。
              reason 为 wait_peer_holding 时,本 topic 的分区还在对方组成员手里,存盘由它们继续消费(切组的滚动发布中途属预期,发布结束后仍在才需要处置);
              其余原因下本 zone 可能已经没有成员在消费,存盘积压在 Kafka 里。
              按 go/db 日志「group handoff waiting」里的 reason 查:wait_peer_holding = 对方组仍有成员持有本 topic 的分区(多半是本 zone 还有跑对方组的旧 Pod 没退出);
              wait_peer_rebalancing = 对方组正在再平衡(对方是共享的 legacy 组时,其它 zone 的发布会让它反复再平衡,切组期间冻结其它 zone 的发布);
              wait_own_unavailable / wait_peer_unavailable = 本组 / 对方组的位点或状态查询失败(查 Kafka coordinator 与 broker);
              wait_peer_state_unknown = 对方组状态无法识别;wait_own_behind_peer(日志「group handoff refused」)见 DbConsumerGroupHandoffOwnBehindPeer。

        # critical 只在本 zone 没有任何 db Pod 越过交接闸时才呼人,所以取 min 而不是 max:gauge 每个进程一份、没有 label,
        # 放行是进程内状态(新进程从「未放行」起步)。交接形状要到 FinalizeHandoff 之后再跑一次 keep zone-up 才去掉,这段时间里
        # 单个副本重启(崩溃、驱逐、节点排空)都会重新过闸,而同 namespace 已放行的本组副本照常消费全部分区 —— 这时
        # 已放行副本的 0 值压住本条,只由上面的 DbConsumerGroupHandoffWaiting(max)告警。最终形状不建交接闸,序列恒为 0,同样压住本条。
        - alert: DbConsumerGroupHandoffStuck
          expr: |
            min by (namespace) (db_consumer_group_handoff_waiting_seconds) > 300
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 的 go/db 全部副本在消费组交接闸前卡住超过 5 分钟"
            description: >-
              本 namespace 里上报该指标的 go/db Pod 都在交接闸前等了 5 分钟以上,等得最短的约 {{ $value | printf "%.0f" }} 秒(min by namespace)。
              被闸住的 Pod 不入组、不消费;同 namespace 里该 gauge 为 0 的本组副本(已放行)照常消费,有这样的副本时本条不响。
              本条响时,除非 reason 是 wait_peer_holding、持有分区的是仍在正常消费的旧 Pod(切组发布中途;旧 Pod 跑的是还没有这个指标的版本时会出现),
              本 zone 的存盘已完全停下、积压在 Kafka 里。按 pod 核对:去掉聚合查 db_consumer_group_handoff_waiting_seconds,
              每个 db Pod 都 > 0、且没有 wait_peer_holding 的旧 Pod 在消费,才是无人消费。
              db_task 的保留由 k8s_deploy.ps1 按 -KafkaProfile 设置:retention.ms 缺省(prod)24h、prod-like 6h、dev 1h;
              retention.bytes 按设计写入速率 × 缓冲目标(prod / prod-like 2h,dev 1h,与 dev 的 retention.ms 相同)推算,盘放不下时会被收缩(FitLimited),
              实际缓冲以部署输出 Kafka disk ledger 行的 implied_db_task_buffer_min 为准;积压超过这段缓冲,还没消费的存盘会被 Kafka 删除、不会再落库。
              先按 pod 确认是否还有本组副本在消费,再按 DbConsumerGroupHandoffWaiting 的 reason 处置;确实无人消费、按 reason 又处置不了时,
              才按 docs/design/db-consumer-group-per-zone.md 的回退步骤退回交接之前的形状。

        # R7:两组在同一分区都有位点且对方更大。放行会从陈旧位点大段重放,所以闸不放。每次判定记一次(≤1/s/Pod)。
        - alert: DbConsumerGroupHandoffOwnBehindPeer
          expr: |
            sum by (namespace) (increase(db_consumer_group_handoff_gate_total{outcome="wait_own_behind_peer"}[5m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 的消费组交接被拒:本组位点落后于对方组"
            description: >-
              过去 5 分钟交接闸约 {{ $value | printf "%.0f" }} 次判定 wait_own_behind_peer:两组在本 topic 的同一分区上都有已提交位点,且对方组的更大。
              本组位点是陈旧的,放行就会从陈旧位点大段重放已落库的写,所以闸一直不放,本 zone 存盘消费暂停。
              处置是删除陈旧一方在本 topic 上的位点(go/db 日志「group handoff refused」里给出了具体组名):
              本组陈旧(上一次交接没有收尾)时用 tools/scripts/kafka_offset_reset.ps1 -Group <对方组> -RetireGroup <本组> -FinalizeHandoff;
              对方陈旧(本组是有意拨回的,例如回档)时用重置模式加 -RetireGroup <对方组>,同 k8s_zone_rollback.ps1 的 Step 5。
              不要手工改排序游标或 applied 游标。

        # 守望发现对方组正在消费本 topic,本实例已让出 session。
        - alert: DbConsumerGroupHandoffConflict
          expr: |
            sum by (namespace) (increase(db_consumer_group_handoff_conflict_total[10m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 有对方消费组的成员在消费本 zone 的 db_task topic"
            description: >-
              过去 10 分钟守望约 {{ $value | printf "%.0f" }} 次发现对方组正在消费本 topic(Stable、持有本 topic 的分区、已提交位点在前进),本实例已让出 session 并重新过闸。
              一个守望周期(5s)加一轮再平衡之内两组可能同时消费同一分区,这期间只靠游标、排序锁与 owner_epoch 兜底。
              多半是旧发布物被误部署(还在用对方组名的旧 Pod 或旧 ConfigMap):按 go/db 日志「group handoff conflict」确认对方组,先处理掉那个 Pod,再核对本 zone 的 go-svc-db-config。

        # Setup 播种时位点查询失败:Setup 报错,成员重新入组。按分区计数,一次失败会记多个。
        - alert: DbConsumerGroupHandoffSeedAborted
          expr: |
            sum by (namespace) (increase(db_consumer_group_handoff_total{result="aborted"}[5m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的消费组交接播种查询失败"
            description: >-
              过去 5 分钟约 {{ $value | printf "%.0f" }} 个分区的播种因位点查询失败而中止(aborted)。
              播种失败会让 session Setup 报错、成员约 1s 后重新入组,本 zone 组随之反复再平衡,存盘消费一停一启。
              查 Kafka coordinator 与 broker 是否正常、对方组(正向交接时就是 legacy 组)的位点是否可读;go/db 日志搜「group handoff seeding failed」。

    # 存盘补投(go/db/internal/saveoutbox,data-overwrite-rollback-audit-20261018.md §2.2 go-db-pipeline#1):
    # db_save_outbox_total{result} 由每个 dual 实例的补投器计数,启动时以 0 建出全部 result。terminal / exhausted 在每次复查
    # (缺省 10 分钟一次)时重复计数,所以「15 分钟窗口内有增量」= 此刻仍有停在该状态的意图。
    - name: db-task.save-outbox
      interval: 30s
      rules:
        # 意图补投达到次数上限仍未取得两表 SQL ACK:补投器已停止重投,这名玩家下次登录会被提交屏障拒绝。
        - alert: DbSaveOutboxExhausted
          expr: |
            sum by (namespace) (increase(db_save_outbox_total{result="exhausted"}[15m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 有存盘意图补投已达上限仍未落库"
            description: >-
              过去 15 分钟复查到约 {{ $value | printf "%.0f" }} 次停在 exhausted 的意图:同一版本已补投 MaxAttempts 次(缺省 8 次,退避封顶 10 分钟),
              两张玩家表的 SQL ACK 仍不齐。补投器不再重投;原意图字节、pending 与补投桶成员都保留,MySQL 落后于父快照,
              这些玩家冷登录与跨场景交接会被提交屏障拒绝。go/db 日志搜「补投已达上限」拿到玩家号,按同期的延后 / 死信原因归因
              (db_task_deferred_total、db_task_dead_letter_total)。原因消除后对该玩家 HDEL player:{<id>}:save_barrier outbox_attempts
              重新开始计数;不要删除 outbox_* 其余字段或补投桶成员,那是这笔存盘唯一的待投副本。

        # 意图已被 go/db 判为确定性拒写(进死信的围栏 / 归属 / 路由结局、Redis 归属守卫判陈旧、大字段闸、资产证据冲突)。
        - alert: DbSaveOutboxTerminal
          expr: |
            sum by (namespace) (increase(db_save_outbox_total{result="terminal"}[15m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 有存盘意图因确定性拒写停止补投"
            description: >-
              过去 15 分钟复查到约 {{ $value | printf "%.0f" }} 次停在终态的意图。终态原因写在 player:{<id>}:save_barrier 的 outbox_terminal_reason,
              载荷在死信(kafka:dead:queue:{topic})或原意图里保全。同一版本不会再被重投,也就不会再每轮多一条死信。
              该玩家下一次存盘(新版本)会自动离开终态;离线玩家要按死信原因处置(大字段:裁剪数据或调高 BlobGuard 后用死信工具重新入队)。

        # legacy go/db 与 dual 补投并存:补投整拍暂停,等 legacy 实例按世代门禁退出。
        - alert: DbSaveOutboxPausedByLegacyWriter
          expr: |
            sum by (namespace) (increase(db_save_outbox_total{result="legacy_alive"}[10m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 仍有 legacy go/db 在消费,存盘补投已暂停"
            description: >-
              本 zone 的 db:save_protocol:legacy_alive:zone:<ZoneId> 持续存在:有 Fencing.Mode=legacy 的 go/db 在续写存活标记。
              现行 scene / login 只说严格提交屏障,legacy 实例不写两表 SQL ACK,本 zone 冷登录会持续失败。
              legacy 实例发现世代标记后应在 5 秒内自行停机并以非零码退出(日志 SAVE-PROTOCOL-CONFLICT);持续告警说明它没退出,
              或部署仍在拉起 legacy 配置。把该 zone 的 go-svc-db-config 改回 Fencing.Mode=dual 并滚动重启。
