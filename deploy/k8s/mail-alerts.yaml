# Prometheus alert rules for the mail service(邮件,go/mail)。
#
# 来源:docs/design/mail-system.md §4.7(告警)、§4.6(sweep 指标)、§12.2 偏差第 10 条(invalid_rows 计数器带 _total)。
#
# Install as a PrometheusRule CR (kube-prometheus stack),与 player-inbox-alerts.yaml / owner-epoch-alerts.yaml 同法:
#   kubectl apply -n observability -f deploy/k8s/mail-alerts.yaml
#
# Scrape prerequisites:
#   - manifests/go-svc/mail.yaml 的 Pod 带 prometheus.io/scrape 注解,metrics 端口见该 manifest(ConfigMap 的 MetricsListenAddr);
#     集群里要有 ServiceMonitor / PodMonitor(或按注解抓取的 job)指向它,否则本文件的规则一条都不会触发。
#
# 聚合口径:
#   - mail 多副本各跑各的 sweep(不选主),每个副本都写 mail_sweep_last_run_unixtime → 规则一律 max() 聚合:
#     只要有一个副本还在推进就不算卡死(DELETE … LIMIT 天然可并发,一个副本的 sweep 足够);
#   - 计数器每个副本各报一份 → sum(increase(...)) 跨副本求和;
#   - label 只用有限枚举,不用 player_id(AGENTS §9);
#   - mail 的 CounterVec 在进程启动时按封闭集合预建 0 值序列(internal/metrics 的 Register),increase(...) 从第一次就能看见。
#
# 没有 mail Pod 时(还没部署 / 全部下线)这些序列都不存在,规则既不触发也不报错 —— 进程存活由 Deployment / 探针告警负责,本文件不覆盖。
#
# Severity conventions(与 scene-manager-alerts.yaml 相同):
#   critical = pager, someone wakes up
#   warning  = next-business-hours channel
#   info     = dashboard annotation / trend signal
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mail-alerts
  labels:
    app: mail
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: mail.sweep
      interval: 60s
      rules:
        # sweep 循环卡死或停止调度:每轮结束(含失败、含 0 行、含 report_only)都写 mail_sweep_last_run_unixtime,
        # 进程启动时也先写一次,所以它长期不前进只可能是循环卡住 / 崩掉之后没再调度。
        # 阈值 = 3 × Sweep.Interval。ConfigMap 里 Sweep.Interval 取自 go/mail/etc/mail.yaml(当前 5m = 300s);
        # 改 Interval 时同步改这里的 900。
        # 后果:过期邮件不再被物理删除,而 ListMails 读系统有效集要靠 sweep 保持有界(§4.7)。
        - alert: MailSweepStalled
          expr: |
            time() - max(mail_sweep_last_run_unixtime) > 900
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "mail sweep 已超过 3 个周期没有跑完一轮"
            description: >-
              所有 mail 副本的 mail_sweep_last_run_unixtime 都停在 {{ $value | printf "%.0f" }} 秒之前。
              查 mail 日志里 "[mail] Sweep" 的最后一行与 safego_panic_total{point=~"mail.expired_sweep.*"};
              sweep 的单轮预算是 30 秒,一轮跑不完会在下一轮继续,不会长期卡住 —— 长期不前进说明循环本身停了。

        # expire_ms = 0 的行:发件校验要求 expire_ms > sent_ms,出现这种行只能是有人绕过发件路径直接写库。
        # sweep 对它们只计数不删(fail-closed),不处理就会永远留着。
        - alert: MailSweepInvalidRows
          expr: |
            sum(increase(mail_sweep_invalid_rows_total[1h])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "mmorpg_mail 里出现 expire_ms = 0 的邮件行"
            description: >-
              过去 1 小时 sweep 看到约 {{ $value | printf "%.0f" }} 行 expire_ms = 0(按表看 label table)。
              这些行不会被自动删除。查清写入来源(发件校验被绕过、手工 SQL)后人工处理。

    - name: mail.read
      interval: 60s
      rules:
        # 有效系统邮件超过 Mail.MaxActiveSystemMails:ListMails 只读最新的那么多封,更早的系统邮件玩家看不到。
        - alert: MailSystemListTruncated
          expr: |
            sum(increase(mail_list_truncated_total[10m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "有效系统邮件超过上限,玩家少看到系统邮件"
            description: >-
              过去 10 分钟 ListMails 有约 {{ $value | printf "%.0f" }} 次撞到 Mail.MaxActiveSystemMails 的读上限。
              发件侧本有同一上限(软上限,并发发件可能略超);持续出现说明有效系统邮件太多 ——
              等过期、或调低发件节奏;调高上限前先评估 ListMails 每次读系统有效集的开销(docs/design/mail-system.md §3.1)。
