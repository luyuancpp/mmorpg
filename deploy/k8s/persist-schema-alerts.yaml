# Prometheus alert rules for 玩家持久 schema 世代校验(go/db 侧,混版本持久字段保护第 2 批)。
#
# 来源:docs/design/mixed-version-persist-field-protection.md §6.2(C0 / C1 / C1b / C2)与 §8.4;
#       运维处置见 deploy/k8s/README.md「玩家持久 schema 世代」一节。
# 指标定义:go/db/internal/metrics/metrics.go(task_deferred_total{reason="schema_too_new"} /
# task_dead_letter_total{reason="persist_unstamped"|"schema_regression"} / task_read_abandoned_total{reason="schema_too_new"} /
# persist_schema_gen / persist_schema_bootstrap_closed / persist_schema_unstamped_write_total)。
# 这些取值在 go/db 启动时就以 0 建出序列,increase 能抓到第一次。
#
# C++ 侧(严格提交屏障 C3)与 login 侧(加载门禁 C4)的告警随第 3b / 4 批落码后补进本文件;在那之前本文件只覆盖 go/db。
# persist_unstamped 与 schema_regression 两类死信同时也会触发 db-task-retry-alerts.yaml 的 DbTaskDeadLetterAdded(warning);
# 本文件的 critical 才带处置说明,以本文件为准。
#
# Install as a PrometheusRule CR (kube-prometheus stack),与 db-task-retry-alerts.yaml 同法:
#   kubectl apply -n observability -f deploy/k8s/persist-schema-alerts.yaml
# 抓取前提同 db-task-retry-alerts.yaml(go/db 的 :9160 与对应的 ServiceMonitor / PodMonitor)。
#
# Severity conventions(与 scene-manager-alerts.yaml 相同):
#   critical = pager, someone wakes up
#   warning  = next-business-hours channel
#   info     = dashboard annotation / trend signal
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: persist-schema-alerts
  labels:
    app: db
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: db-task.persist-schema
      interval: 30s
      rules:
        # C1:写方的持久 schema 世代高于本 zone 的 go/db。存盘在 Redis 里完好,但落不进 MySQL;滚动发布期间短暂出现属正常。
        - alert: DbTaskSchemaTooNew
          expr: |
            sum by (namespace) (rate(db_task_deferred_total{op="write", reason="schema_too_new"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 的 go/db 世代低于写方,存盘落不进 MySQL"
            description: >-
              过去 5 分钟写任务以每秒约 {{ $value | printf "%.2f" }} 条的速率因世代超前(schema_too_new)延后。
              说明有 scene 已按更新的持久 schema 世代存盘,而本 zone 还有旧版 go/db 在消费(违反「先升 go/db」的发布顺序,或 go/db 被回滚)。
              这些写不耗重试预算,留在 Redis 重试队列里,不会丢;在升级完成之前不要重启或清空这台 Redis。
              处置:按 db_persist_schema_gen 找出世代偏低的 go/db Pod,把它升到不低于写方的版本,或者把滚动发布走完。

        # C2:SQL 行的世代高于读它的 go/db。冷加载会直接失败,玩家进不了游戏。
        - alert: DbTaskReadSchemaTooNew
          expr: |
            sum by (namespace) (increase(db_task_read_abandoned_total{reason="schema_too_new"}[10m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的 go/db 读到更新世代的玩家行,冷加载被拒"
            description: >-
              过去 10 分钟约 {{ $value | printf "%.0f" }} 次读被立即回失败:行的持久 schema 世代高于这台 go/db,
              它读出的是缺列的截断副本,不能交给 login。处置同 DbTaskSchemaTooNew:把 go/db 升到不低于数据世代的版本。

        # C0:引导期关闭后仍有机制上线前的写方(不盖戳的 scene)。
        - alert: DbTaskPersistUnstamped
          expr: |
            sum by (namespace) (increase(db_task_dead_letter_total{reason="persist_unstamped"}[10m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 引导期关闭后仍收到未盖戳的玩家存盘"
            description: >-
              过去 10 分钟约 {{ $value | printf "%.0f" }} 条未盖戳的玩家表写被送进死信(persist_unstamped)。
              有机制上线前的 scene 在本 zone 运行,它会截断新字段;它的存盘没有落库,SQL 保持完好。
              处置:找到并下线该 scene(看 go/db 日志 PERSIST-UNSTAMPED 行的 taskID);受影响玩家的父快照按 README 的步骤清理后走冷加载。
              死信条目保留原件,不要自动搬回 ready。

        # C1b:写方世代低于 SQL 行世代 —— 链路上有人截断过数据。
        - alert: PersistSchemaRegression
          expr: |
            sum by (namespace) (increase(db_task_dead_letter_total{reason="schema_regression"}[10m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} 的玩家存盘世代低于已落库数据,已拒写"
            description: >-
              过去 10 分钟约 {{ $value | printf "%.0f" }} 条玩家表写因世代倒退被拒(schema_regression):
              写方基于一份被截断过的数据存盘。SQL 保持原样,这名玩家的后续存盘也会一直被拒,冷加载与交接可能卡住。
              处置:按 go/db 日志 PERSIST-SCHEMA-REGRESSION 行定位玩家与写方,暂停该写方所在版本的发布;
              按 README「玩家持久 schema 世代」一节核对父快照与 SQL 行,确认以 SQL 为准后清理父快照走冷加载。

        # 同一 zone 内 go/db 的世代不一致超过 30 分钟:滚动发布卡在半途。
        - alert: DbPersistSchemaMixedGenerations
          expr: |
            (max by (namespace) (db_persist_schema_gen) - min by (namespace) (db_persist_schema_gen)) > 0
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "{{ $labels.namespace }} 的 go/db 持久 schema 世代不一致超过 30 分钟"
            description: >-
              同一 zone 的 go/db Pod 编译进了不同的持久 schema 世代(最大与最小相差 {{ $value }})。
              滚动发布期间短暂出现属正常;持续存在说明发布卡住,低世代 Pod 会让新世代的写延后、读失败。
