apiVersion: v1
kind: Service
metadata:
  name: player-locator
  labels:
    app: player-locator
    tier: go-svc
spec:
  selector:
    app: player-locator
  ports:
    - name: grpc
      port: 50100
      targetPort: 50100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: player-locator
  labels:
    app: player-locator
    tier: go-svc
spec:
  # 2 副本:player_locator 的全部状态在 Redis,进程内不留会话。两条后台链路都已按多实例写好 ——
  # LeaseMonitor 用一段 Lua 原子领取过期租约(领取即移入 processing + 每 claim 一个 token,
  # 带 token 的提交成功后才发踢人/LeaveScene,持有者死亡则 claim 超时被收回重试);
  # SessionReconciler 的去抖表在进程内各记各的,转换走与 SetDisconnecting 相同的整字节 CAS,
  # 后动手的副本读到的已是 DISCONNECTING,直接跳过。代价只有共享 Redis 每 60s 多一轮 SCAN。
  # (2026-10-18 更正:SessionReconciler 已改为全服单 leader + 按 gate 实例建的会话索引,不再每副本 SCAN 全键空间;
  # leader 由共用会话 Redis 上的锁选出,两个 leader 短暂重叠时转换仍走整字节 CAS,无害。见
  # docs/design/player-locator-gate-session-index.md。)
  # 单副本时它是登录链路的真单点:它不可用期间所有 EnterGame 失败,login 自己也因阻塞式拨号起不来。
  replicas: 2
  selector:
    matchLabels:
      app: player-locator
  template:
    metadata:
      labels:
        app: player-locator
        tier: go-svc
      # 抓取 /metrics(9190 = player_locator,与 ConfigMap 的 Prometheus 段及下面的 metrics 容器端口一致)。
      # 会话对账的 leader 卡死 / 无 leader 只能靠这些指标与 deploy/k8s/player-locator-alerts.yaml 发现。
      # 必须与 tools/scripts/k8s_deploy.ps1 player-locator heredoc 的 Prometheus 段同批发布(或先发后者):
      # 只有注解、进程没在 9190 监听时,按注解抓取的目标是 down,可能误触通用的 TargetDown 类告警。
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9190"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          # 两个副本尽量不落同一节点,否则单节点故障等于全池不可用
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: player-locator
                topologyKey: kubernetes.io/hostname
      containers:
        - name: player-locator
          image: PLACEHOLDER_IMAGE
          imagePullPolicy: PLACEHOLDER_PULL_POLICY
          env:
            - name: GOLANG_PROTOBUF_REGISTRATION_CONFLICT
              value: warn
          args: ["-f", "/app/etc/player_locator.yaml"]
          ports:
            - containerPort: 50100
              name: grpc
            # 与 ConfigMap 的 Prometheus.Port 9190 及上面 prometheus.io/port 注解一致(9190 = player_locator)
            - containerPort: 9190
              name: metrics
          readinessProbe:
            grpc:
              port: 50100
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50100
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: svc-config
              mountPath: /app/etc
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      terminationGracePeriodSeconds: 30
      volumes:
        - name: svc-config
          configMap:
            name: go-svc-player-locator-config
---
# PDB 直接放在本文件里:k8s_deploy.ps1 只 apply 各服务目录表里登记的主 manifest,
# 独立的 *-pdb.yaml 不会被脚本应用 —— 别拆出去。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: player-locator-pdb
  labels:
    app: player-locator
    tier: go-svc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: player-locator
