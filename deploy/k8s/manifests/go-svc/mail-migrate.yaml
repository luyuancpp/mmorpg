# 与常驻实例使用同一配置及DSN。只迁结构，不读取producer/资产密钥。
apiVersion: batch/v1
kind: Job
metadata:
  name: mail-migrate
  labels: {app: mail-migrate, tier: go-svc}
spec:
  backoffLimit: 4
  podFailurePolicy:
    rules:
      - action: FailJob
        onExitCodes: {containerName: mail-migrate, operator: In, values: [1, 4]}
      - action: Ignore
        onPodConditions:
          - {type: DisruptionTarget}
  template:
    metadata:
      labels: {app: mail-migrate, tier: go-svc}
    spec:
      restartPolicy: Never
      containers:
        - name: mail-migrate
          image: PLACEHOLDER_IMAGE
          imagePullPolicy: PLACEHOLDER_PULL_POLICY
          args: ["-f", "/app/etc/mail.yaml", "-migrate"]
          env:
            - name: MMORPG_MAIL_SQL_DSN
              valueFrom:
                secretKeyRef: {name: domain-service-secrets, key: mail-sql-dsn, optional: false}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 1000m, memory: 512Mi}
          volumeMounts:
            - {name: svc-config, mountPath: /app/etc, readOnly: true}
      volumes:
        - name: svc-config
          configMap: {name: go-svc-mail-config}
