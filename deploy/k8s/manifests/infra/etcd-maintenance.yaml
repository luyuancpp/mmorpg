# etcd MVCC 历史压缩:CronJob `etcd-compact`(P0-C 阶段 1a,docs/handoff/global-singletons-p0-findings-20261014.md「## P0-C」)。
#
# 为什么要有它:
#   etcd 在被压缩之前保留每个 key 的全部历史版本。本仓库有持续写入方(Go snowflakealloc 每个持有者每秒一笔水位
#   Txn、login 另有毫秒水位、过渡期镜像双写、gate 每 10s 人数上报),而 etcd.yaml / docker-compose.yml 原先既没开
#   自动压缩,也没有任何脚本调 Compact。历史只增不减,库写到配额(默认 2GiB,待实测)就触发 NOSPACE 告警:
#   新注册、失租重注册、gate 上报、全部水位 Txn 立即失败。原理、取值与处置见 docs/ops/etcd-maintenance-runbook.md。
#
# 为什么是独立 CronJob、而不是给 etcd.yaml 加 ETCD_AUTO_COMPACTION_* env:
#   改 StatefulSet 的 env / 镜像 / 注解就是改 Pod 模板,会逐个滚动 3 个 etcd 成员;C++ 节点的 etcd 双向流断开后
#   不重建(P0-D),所以在 C++ etcd 流重建(docs/design/grpc-muduo-transport.md §10.2 第 2 批)验证通过之前,
#   etcd 不能滚动。本文件只新增对象,apply 它**不会**触碰 StatefulSet `etcd`。env 自动压缩属阶段 2,见 runbook。
#
# 它做什么 / 不做什么:
#   - 每 5 分钟用线性一致读取当前 revision,压缩到 current - KEEP_REVISIONS;current 不超过保留量时跳过。
#   - 不做 defrag(defrag 会阻塞所在成员,只走 runbook 的手工逐成员流程);不解除告警(alarm disarm 必须在
#     人确认空间已腾出之后由人执行)。
#   - 退出码:0 = 压缩成功 / 已压缩过 / 无需压缩;1 = 读不到 revision、压缩失败、查不到告警(fail-closed,不盲压);
#     2 = 压缩照常做了,但集群有活动告警(多半是 NOSPACE),要人按 runbook 处置。非 0 都会让 Job 记为 Failed,
#     `kubectl -n <infra> get jobs -l app=etcd-maintenance` 能看到(failedJobsHistoryLimit 保留最近 5 次)。
#     仓库里还没有对 etcd 的抓取与告警规则,所以目前「失败可见」只靠 Job 状态与 infra-status。
#
# 部署:
#   - `k8s_deploy.ps1 -Command infra-up` 会在 etcd.yaml 之后 apply 本文件(Apply-Infra 的 $infraManifests)。
#   - **有真实存档的环境不要为了它跑 infra-up**:infra-up 会连带 apply mysql.yaml,在 L-04 部署前不得这样做
#     (docs/handoff/godb-pipeline-handoff-20261013.md §2.4)。只 apply 本文件即可,命令见 runbook「K8s:部署」。
#   - 所有 __INFRA_NAMESPACE__ 占位与其它 infra 清单一样由 Apply-Infra 在 apply 前替换成 -InfraNamespace;
#     单独 apply 时必须自己替换(runbook 给了命令)。忘了替换的话端点 DNS 解析失败,Job 以 1 退出,不会静默成功。
#   - 标签一律是 app: etcd-maintenance,**绝不能是 app: etcd**:那会被 etcd 的 Service / PDB / StatefulSet 的
#     selector 选中(本 Pod 不监听 2379,进了 Service 的 endpoint 就是黑洞)。
#
# 取值(负责人 2026-10-15 定,取值待实测 / 压测复核):
#   - KEEP_REVISIONS = 1000000。按每 zone 约 6.2 revision/s 推算:1 个 zone 约 34 小时、10 个约 4.3 小时、100 个约
#     27 分钟的历史窗口;每 revision 字节数未实测(M2)。扩 zone 时同步调大。必须与 deploy/docker-compose.yml 的
#     ETCD_AUTO_COMPACTION_RETENTION 相同(tools/scripts/tests/etcd_maintenance_contract.tests.ps1 守住)。
#   - 镜像与 etcd.yaml 逐字相同(同一个 etcdctl 版本)。钉 tag@摘要待 Codex 实测 M0 后与 etcd.yaml、compose 同批改;
#     改 etcd.yaml 的镜像会滚动 etcd,所以同样要等阶段 2 的前置。
#
# 手工触发一次:
#   kubectl --context <ctx> -n <infra> create job --from=cronjob/etcd-compact etcd-compact-manual-<时间戳>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: etcd-maintenance-scripts
  labels:
    app: etcd-maintenance
data:
  # 脚本放 ConfigMap 而不是内联在 command 里:验证时能把同一份原文取出来,在临时容器里跑(runbook「compose」一节同理)。
  compact.sh: |
    # 只做压缩。不做 defrag(会阻塞所在成员,见 runbook 的手工逐成员流程),也不解除告警(必须由人确认空间腾出后再做)。
    # 不用 set -e:每一步的失败都在下面显式判定,决定是失败(1)还是可见的告警(2)。
    set -u
    : "${KEEP_REVISIONS:?KEEP_REVISIONS is required}"
    # 只收不带前导 0 的正整数:sh 算术里前导 0 会按八进制解释。
    case "$KEEP_REVISIONS" in
      ''|0*|*[!0-9]*)
        echo "KEEP_REVISIONS must be a positive integer without leading zeros, got: $KEEP_REVISIONS"
        exit 1
        ;;
    esac

    # 压缩目标只能来自线性一致读(--consistency=l,经 leader 确认的当前 revision);读失败或解析不出时绝不盲压。
    # 读一个不存在的键,只为拿应答头里的 revision;不写任何键,本任务自己不产生 revision。
    OUT=$(etcdctl get etcd-maintenance/revision-probe --consistency=l -w json) || {
      echo "read revision failed"
      exit 1
    }
    REV=$(printf '%s' "$OUT" | sed -n 's/.*"revision": *\([0-9][0-9]*\).*/\1/p')
    case "$REV" in
      ''|*[!0-9]*)
        echo "cannot parse revision from: $OUT"
        exit 1
        ;;
    esac

    TARGET=$((REV - KEEP_REVISIONS))
    if [ "$TARGET" -gt 0 ]; then
      if CMP=$(etcdctl compact "$TARGET" 2>&1); then
        echo "compacted to revision $TARGET (current $REV, keep $KEEP_REVISIONS)"
      else
        # 「已压缩」= 上一轮(或阶段 2 的服务端自动压缩)已经压过这个位置,目标已达成,算成功。报错原文待实测(M3 探针 A)。
        case "$CMP" in
          *"required revision has been compacted"*)
            echo "revision $TARGET already compacted (current $REV, keep $KEEP_REVISIONS)"
            ;;
          *)
            echo "compact failed: $CMP"
            exit 1
            ;;
        esac
      fi
    else
      echo "nothing to compact (current $REV, keep $KEEP_REVISIONS)"
    fi

    # 成员状态只打印、不判失败:滚动或单个成员重启期间,不能把「成员在重启」报成「压缩失败」。
    etcdctl endpoint status -w table || echo "WARN: endpoint status failed for at least one member (not fatal)"

    # 查告警失败按失败处理:若写成管道,查询失败会被当成「没有告警」(fail-open)。
    ALARMS=$(etcdctl alarm list) || {
      echo "alarm list failed"
      exit 1
    }
    if [ -n "$ALARMS" ]; then
      echo "ALARM ACTIVE (compaction above still ran; recovery is manual, see docs/ops/etcd-maintenance-runbook.md):"
      echo "$ALARMS"
      exit 2
    fi
    echo "no active alarm"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-compact
  labels:
    app: etcd-maintenance
spec:
  schedule: "*/5 * * * *"
  # 不叠跑:上一轮没结束(例如首次在涨大的库上压缩)就跳过这一轮。
  concurrencyPolicy: Forbid
  # 控制器停摆超过 2 分钟错过的那一轮直接跳过,不补跑;下一轮 5 分钟后照常。
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  # 失败记录多留几次,失败原因靠 `kubectl logs job/<名字>` 看。
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:
        app: etcd-maintenance
    spec:
      # 不在同一轮里重试:失败要可见,5 分钟后的下一轮就是重试。
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: etcd-maintenance
        spec:
          restartPolicy: Never
          # 只连 etcd,不调 K8s API。
          automountServiceAccountToken: false
          # 与 etcd.yaml 一致:bitnami 镜像以 uid 1001 运行。
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
          containers:
            - name: compact
              # 与 etcd.yaml 的 StatefulSet 逐字相同(etcd_maintenance_contract.tests.ps1 守住)。
              # 钉 tag@摘要待 Codex 实测 M0 后与 etcd.yaml 同批改(改 etcd.yaml 的镜像会滚动 etcd,前置见 runbook「阶段 2」)。
              # 覆盖 command 后 etcdctl 仍在 PATH 上、etcdctl 认 ETCDCTL_ENDPOINTS,均待 Codex 实测(M0、V4-d)。
              image: bitnamilegacy/etcd:latest
              imagePullPolicy: IfNotPresent
              command: ["sh", "/scripts/compact.sh"]
              env:
                # 逐成员列出(而不是 Service `etcd`):endpoint status 要覆盖全部成员。成员数与 etcd.yaml 的 replicas 一致
                # (契约测试守住);FQDN 里的 namespace 与 etcd.yaml 的广播地址同一占位。
                - name: ETCDCTL_ENDPOINTS
                  value: "http://etcd-0.etcd-headless.__INFRA_NAMESPACE__.svc.cluster.local:2379,http://etcd-1.etcd-headless.__INFRA_NAMESPACE__.svc.cluster.local:2379,http://etcd-2.etcd-headless.__INFRA_NAMESPACE__.svc.cluster.local:2379"
                # 保留最近多少个 revision。取值与理由见文件头;与 compose 的 ETCD_AUTO_COMPACTION_RETENTION 相同。
                - name: KEEP_REVISIONS
                  value: "1000000"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: etcd-maintenance-scripts
