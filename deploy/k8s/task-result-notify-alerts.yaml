# Prometheus alert rules for task:result 读回执到达通知分频道(go/db → login,B0-3 第 2 批)。
#
# 来源:docs/handoff/launch-readiness-20261013/spec_B0-3_task_result_channel.md(规格、核实意见与文末两批交付说明)。
#       go/db 写完 task:result:{task_id} 后按 DBTask.reply_instance 只 PUBLISH 一次:合法发发起方 login 的实例频道
#       task:result:notify:<id>,为空或不合法回落全服旧频道 task:result:notify;新版 login 两条频道都订着。
# 指标定义:go/db/internal/metrics/task_result_notify.go 的 task_result_notify_total{target,result}(Prometheus 名
# db_task_result_notify_total)。target 取 instance | legacy_unset | legacy_invalid,result 取 ok | no_receiver | error;
# 进程启动时(metrics.Start 暴露端点之前)以 0 建出全部 3×3=9 条序列,rate / increase 能抓到第一次。
# login 侧的对照指标是 login_task_result_delivery_total{outcome}(go/login/internal/dispatcher/metrics.go,:9101),
# 本文件不对它设告警,金丝雀时人工对照。
#
# 与 db-task-retry-alerts.yaml 分开放:那份文件为 L-04 / S1 等批次随时会 apply,而本文件的 LegacyFallback 在 login
# 全量升级之前必然成立,两者 apply 时机不同。PrometheusRule 名也独立,回滚只删这一份。
#
# Install as a PrometheusRule CR (kube-prometheus stack),与 owner-epoch-alerts.yaml 同法:
#   kubectl apply -n observability -f deploy/k8s/task-result-notify-alerts.yaml
#   回滚:kubectl delete -n observability -f deploy/k8s/task-result-notify-alerts.yaml
#
# 安装时机:**go/db 与 login 两侧都全量升级到带本项的版本之后再 apply。** 先上 go/db、再按 zone 金丝雀 login 的
# 滚动期间,旧版 login 发起的读必然计 legacy_unset;LegacyFallback 虽然只在该 namespace 已有 instance 流量时才判,
# 但金丝雀 zone 里新旧 login 混跑超过 2 小时就会响。滚动期间的观察项见 docs/ops/godb-pipeline-launch-todo.md §10。
#
# 阈值(5% / 50 条 / 10 分钟 / 2 小时)都是**待压测基线**的初值:稳态每个 zone 的冷读回执很少(规格估算每个 zone
# 约 0.3/s 甚至更低),一次 login 重启留下的几条 no_receiver 就能把比例推过 5%,所以 NoReceiver 带最低量门槛。
# 有了压测与线上基线后按实测改,并把依据写进本文件。
#
# Scrape prerequisites:
#   - go/db 的 MetricsListenAddr 已配置(K8s 上由 tools/scripts/k8s_deploy.ps1 的 db ConfigMap 写 ":9160")。
#   - A ServiceMonitor or PodMonitor pointed at that port.
#   前提不满足时这些告警是哑的;上线检查见 docs/ops/godb-pipeline-launch-todo.md。
#
# 口径:每个 go/db Pod 只报自己发出的通知,按 namespace(一个 zone 一个 namespace)求和;按 namespace 聚合用的是
# ServiceMonitor / PodMonitor 默认附加的 namespace 标签。
#
# Severity conventions(与 scene-manager-alerts.yaml 相同):
#   critical = pager, someone wakes up
#   warning  = next-business-hours channel
#   info     = dashboard annotation / trend signal
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: task-result-notify-alerts
  labels:
    app: db
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: db-task.result-notify
      interval: 30s
      rules:
        # 实例频道上的通知大面积没人收。最常见的原因是 go/db 与 login 对频道名的认知不一致(两端频道名只来自
        # go/shared/taskresult,出现即说明有一侧用了不同的版本或改坏了契约),或者 login 大面积重启。
        # 阈值待压测基线:5% 比例 + 10 分钟内至少 50 条 instance 通知的最低量门槛。
        # 盲区:PUBLISH 返回的订阅者数包含模式订阅(PSUBSCRIBE)命中的客户端。有人在 redis-cli 里开着
        # PSUBSCRIBE task:result:notify:*(或更宽的模式)没退出,或有常驻的排查 / 监控 sidecar 这样订着时,实例频道的
        # 每条通知都至少有 1 个接收者,发起方不在也计 ok,no_receiver 被压成 0,本告警恰好在排查期间失明(旧频道不带
        # 冒号后缀,不受 task:result:notify:* 影响)。排查只用 PUBSUB CHANNELS / PUBSUB NUMSUB 这类不建订阅的命令;
        # 不得不 PSUBSCRIBE 时尽快退出,期间的 no_receiver 视为偏低。运维检查:task:result 所用 Redis 上
        # redis-cli PUBSUB NUMPAT 应为 0(仓库里没有组件用 PSUBSCRIBE);非 0 时用 redis-cli CLIENT LIST 找 psub>0 的连接。
        - alert: DbTaskResultNotifyNoReceiver
          expr: |
            (
              sum by (namespace) (rate(db_task_result_notify_total{target="instance",result="no_receiver"}[5m]))
              /
              sum by (namespace) (rate(db_task_result_notify_total{target="instance"}[5m]))
            ) > 0.05
            and on (namespace)
            sum by (namespace) (increase(db_task_result_notify_total{target="instance"}[10m])) > 50
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} 的读回执实例频道通知大面积无人接收"
            description: >-
              过去 5 分钟 go/db 发往 login 实例频道的读回执通知里,约 {{ $value | humanizePercentage }} 没有任何订阅者,已持续 10 分钟。
              这些冷读要等满 login 的任务 TTL(EnterGame 8 秒)才靠兜底 LPOP 取回:进场变慢,玩家锁持有时间变长。
              先看 login 是否在大面积重启;不是的话,多半是 go/db 与 login 对频道名的认知不一致 ——
              用 redis-cli PUBSUB CHANNELS 'task:result:notify:*' 对照 login 启动日志打印的 reply_instance。
              处置:回滚最近升级的一侧(任一侧回滚都立即恢复:go/db 回滚后全部发旧频道,login 回滚后读任务不再带回复目标)。
              同时看 login_task_result_delivery_total{outcome=~"salvaged|timed_out"} 是否同步上升。

        # 已经有定向流量的 zone 里仍有通知回落旧频道。target=legacy_unset:还有 login 没升级,或有新的读生产者没填
        # reply_instance;target=legacy_invalid:有生产者填了不合法的 reply_instance(go/db 日志
        # "invalid reply_instance" 带 taskID 与截断后的值)。只在该 namespace 已有 instance 流量时才判,go/db 先上、
        # login 尚未升级的阶段保持沉默;login 全量升级之前仍会在金丝雀 zone 响,所以全量之后再 apply。
        - alert: DbTaskResultNotifyLegacyFallback
          expr: |
            sum by (namespace, target) (rate(db_task_result_notify_total{target!="instance"}[30m])) > 0
            and on (namespace)
            sum by (namespace) (rate(db_task_result_notify_total{target="instance"}[30m])) > 0
          for: 2h
          labels:
            severity: info
          annotations:
            summary: "{{ $labels.namespace }} 仍有读回执通知回落全服旧频道({{ $labels.target }})"
            description: >-
              过去 30 分钟该 zone 以每秒约 {{ $value | printf "%.3f" }} 条的速率把读回执通知发往全服旧频道 task:result:notify,
              而同一 zone 已有定向到 login 实例频道的流量,已持续 2 小时。回落照样能送达(新版 login 也订着旧频道),
              但这部分通知仍是全服广播,投递量 = 通知数 × login 实例数。
              legacy_unset:核对该 zone 各 login 副本的镜像版本,或找出新的读生产者(全仓生产代码里发 Op=read 的只有
              login 的 sendDBReadRequests);legacy_invalid:按 go/db 日志里的 taskID 找到写错字段的生产者。
