# team-follow-smoke 配置:两个机器人对「组队跟随 v1.1」的服务端部分做端到端冒烟
# (docs/design/team-system.md「组队跟随 v1.1」V.2;走路跟随本身在客户端,不在本冒烟范围)
#
# 流程:F0 两人离开残留队伍、读出自己的实体号与坐标 → F1 队长 A 走开到离 B 12 以上
#       → F2 A 建队、B 申请、A 同意,B 在 15s 内收到 TeleportS2C(reason=5)且落点在 A 身边 1 以内
#       → F3 双方互相收到对方的 ActorCreate(归队瞬移后可见性重建)
#       → F4 A 起步 / 停步时 B 收到 ActorMoveS2C(move_state 1 → 0),反向同理 → F5 A 解散。
#
# 前置(缺一条就会失败,原因写进 TEAM_FOLLOW_SMOKE_FAIL 的 reason):
#   1. scene 是含组队跟随 v1.1 的二进制(移动广播、入队即跟随、归队瞬移);旧 scene 会停在 F2。
#   2. gate 以 GATE_CLIENT_RPC_ROUTER=1 启动(start_game.ps1 默认),match(含 team)、client_rpc_router 在跑。
#   3. robot_9305 / robot_9306 起步在同一张地图(新号默认如此);不要求同一条线,不同线时 B 会先被带到 A 的线。
#   4. 出生点四周至少有一个方向能走出 12 以上(主城满足)。
#
# 用法(robot/ 目录下):
#   .\robot.exe -c etc/team_follow_smoke.yaml
# 退出码 0 = 全部断言通过(日志有 TEAM_FOLLOW_SMOKE_OK team_id=… 一行);退出码 1 = 任一步失败。
# 可重复运行:F0 先把两个账号带出任何队伍,F1 每次重新拉开距离。

gateway_addr: "http://127.0.0.1:8081" # Gateway HTTP endpoint(/api/assign-gate)
zone_id: 1 # A、B 都登录这个 zone
robot_count: 2 # 语义占位:本模式固定 A / B 两个机器人
account_fmt: "robot_%04d" # 保留骨架字段;本模式用固定账号 robot_9305 / robot_9306
password: "123456"
skill_ids: []
table_dir: "../generated/tables"
action_interval: 3 # 本模式不跑场景 AI 循环,保留默认
report_interval: 5

mode: "team-follow-smoke"

team_follow_smoke:
  # true = 改跑「真实客户端跟随」验收:机器人 B 入队后下线并打印 TEAM_FOLLOW_CLIENT_READY,
  # 外层脚本随后用 DevAutoPilot(-zone 1 -account robot_9306 …)让真实客户端登录同一账号;
  # 机器人 A 当队长按脚本走 6 段,断言客户端每段都跟着走、停在身后约 1.4 处(TEAM_FOLLOW_CLIENT_OK)。
  client_follower: false
  client_wait_seconds: 240 # 等客户端登录并出现在队长视野里的预算(秒)

auth_type: "password"
