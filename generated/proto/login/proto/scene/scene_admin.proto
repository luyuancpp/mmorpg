syntax = "proto3";
option go_package = "login/proto/scene";

import "proto/db/proto_option.proto";
import "proto/common/base/empty.proto";
import "proto/common/base/gm_admin.proto";

option cc_generic_services = true;
option (OptionFileDefaultNode) = NODE_SCENE;


message GameSceneTest
{
}

message GmDescribeEntityRequest
{
  string operator = 1;      // 审计身份，使用与停机 GM 相同的签名信封。
  string reason = 2;        // 必须等于 player_id 十进制串，让签名覆盖目标。
  uint64 player_id = 3;
  bool include_values = 4;  // 附带持久 protobuf 组件的值，仅在鉴权后读取。
}

message GmDescribeEntityResponse
{
  string description = 1;
}

// Normal or session-takeover enter scene
// Reconnect enter scene (time-dependent)
service SceneScene
{
  rpc Test (GameSceneTest) returns (Empty);
  rpc GmGracefulShutdown (GmGracefulShutdownRequest) returns (GmGracefulShutdownResponse);
  rpc GmDescribeEntity (GmDescribeEntityRequest) returns (GmDescribeEntityResponse);
}
