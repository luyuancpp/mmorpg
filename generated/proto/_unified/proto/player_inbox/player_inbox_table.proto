syntax = "proto3";
package player_inbox;

option go_package = "proto/player_inbox";

import "proto/db/proto_option.proto";

// 玩家收件箱独占库 mmorpg_player_inbox 的表结构,唯一事实源(docs/design/player-inbox-service.md §4.1,port-decisions D-14)。
// - 建表 / 加列只经 go/schemamigrate 的 ProtoSource(go/player_inbox 的 data.Tables());业务 SQL 手写,
//   行直接扫进本文件的 message,不另写 Go struct(AGENTS §3)。
// - **不放进** proto/common/database/mysql_database_table.proto:导表器按那个文件生成 zone 库建表清单。
// - D-14 / TiDB 约束(设计 §4.2):主键只用整数列;每表至多一个 UNIQUE;主键、唯一键、二级索引都以 shard 开头,
//   行数据 NONCLUSTERED + SHARD_ROW_ID_BITS 打散(照 rollback_audit_log);string 列建成 MEDIUMTEXT、长度无约束,
//   所以 operator / reason / note 的字节上限在入箱校验里显式检查(设计 §3.4)。
// - shard = player_id % 64,只由 inbox.RowShard 计算;模数是本库建表时定下的契约,与 placement.RouteRowShard 不联动。
// - 枚举列存 uint32(对应 player_inbox.proto 的枚举),不在表 message 里引用枚举类型。
// - 手写 SQL 里列名一律加反引号(operator / action / state 等与 SQL 关键字同名)。
// - proto2mysql 按字段号识别列:字段号上线后不复用,删列写 reserved(AGENTS §4)。
// - 本文件不进客户端 gen_proto.ps1 清单。

// 审计动作,存进 player_inbox_audit.action。
enum PlayerInboxAuditAction {
  PLAYER_INBOX_AUDIT_UNSPECIFIED = 0;
  PLAYER_INBOX_AUDIT_SANCTION = 1;    // GmSanctionPlayer 入箱
  PLAYER_INBOX_AUDIT_VOID = 2;        // VoidItem(未投递直接 VOIDED,或已投递挂 VOID 指令)
}

// 每 (玩家, 域) 一行。锁序第 1:seq 分配、Fetch、Ack、作废都先对它 FOR UPDATE(IB-6)。
message player_inbox_stream {
  option(OptionTableName) = "player_inbox_stream";
  option(OptionPrimaryKey) = "shard,player_id,domain";
  option(OptionIndex) = "shard,notify_due_ms";       // 提醒补发扫描(设计 §6.3)
  option(OptionTiDBNonclusteredPK) = true;
  option(OptionTiDBShardRowIDBits) = 4;
  option(OptionTiDBPreSplitRegions) = 4;

  uint32 shard = 1;           // player_id % 64,只由 inbox.RowShard 计算
  uint64 player_id = 2;
  uint32 domain = 3;          // PlayerInboxDomain
  uint64 next_seq = 4;        // 上次分配的 seq + 1;分配取 max(next_seq, now_ms << 12)(IB-6)
  uint64 fence_epoch = 5;     // owner_epoch 高水位,只升(IB-8);epoch-raise 取最大值的来源之一
  uint32 open_count = 6;      // PENDING 条数(含挂了 VOID 指令的)
  uint64 notify_due_ms = 7;   // 0 = 无待补提醒;>0 = 到点补发。CAS 令牌用 next_seq,不用它(设计 §6.3)
  uint64 created_ms = 8;
  uint64 updated_ms = 9;
}

// 收件箱条目。终态行保留 30 天后物理删除;PENDING 行永不自动删除(IB-1)。
// 表行类型加 row，避免 Go 驼峰名与 RPC 消息 PlayerInboxItem 冲突；数据库表名保持不变。
message player_inbox_item_row {
  option(OptionTableName) = "player_inbox_item";
  option(OptionPrimaryKey) = "shard,player_id,domain,seq";
  option(OptionUniqueKey) = "shard,player_id,producer_kind,request_id";  // 全表唯一的 UNIQUE = 幂等键(IB-2)
  option(OptionIndex) = "shard,state,updated_ms";                         // 清理 / 对账 / 运维列表
  option(OptionTiDBNonclusteredPK) = true;
  option(OptionTiDBShardRowIDBits) = 4;
  option(OptionTiDBPreSplitRegions) = 4;

  uint32 shard = 1;
  uint64 player_id = 2;
  uint32 domain = 3;                  // PlayerInboxDomain
  uint64 seq = 4;
  uint32 msg_type = 5;                // PlayerInboxMessageType
  uint32 producer_kind = 6;           // PlayerInboxProducerKind
  uint64 request_id = 7;              // 生产方幂等键
  bytes content_sha256 = 8;           // sha256(msg_type ‖ issued_at_ms ‖ payload);同键不同摘要 = 冲突
  bytes payload = 9;                  // ≤ 16KiB,按类型规格的 payload_message 编码
  uint32 state = 10;                  // PlayerInboxItemState
  uint32 directive = 11;              // PlayerInboxDirective:NONE / VOID
  uint32 void_reason = 12;            // PlayerInboxVoidReason
  uint32 delivery_count = 13;         // 被 Fetch 返回的次数;0 = 从未投递
  uint64 last_delivered_epoch = 14;
  uint64 last_delivered_ms = 15;
  uint32 outcome_reason = 16;         // 消费方给的 tip id;APPLIED 时为 0
  uint32 finalized_by = 17;           // PlayerInboxFinalizer:CONSUMER / ADMIN
  uint64 decided_epoch = 18;          // 终结时的 owner_epoch
  uint64 issued_at_ms = 19;           // 生产方签发时刻
  uint64 created_ms = 20;
  uint64 updated_ms = 21;
  string operator_name = 22;          // ≤ 64B,入箱时校验
  string note = 23;                   // ≤ 256B,入箱时校验
}

// 运维审计,与入箱 / 作废同库同事务(设计 §6.1)。每条目每种动作一行;重复调用 INSERT IGNORE。
message player_inbox_audit {
  option(OptionTableName) = "player_inbox_audit";
  option(OptionPrimaryKey) = "shard,player_id,domain,seq,action";
  option(OptionTiDBNonclusteredPK) = true;
  option(OptionTiDBShardRowIDBits) = 4;

  uint32 shard = 1;
  uint64 player_id = 2;
  uint32 domain = 3;                  // PlayerInboxDomain
  uint64 seq = 4;
  uint32 action = 5;                  // PlayerInboxAuditAction:SANCTION / VOID
  string operator = 6;                // 调用方自报,≤ 64B
  string peer_addr = 7;               // gRPC 对端地址,唯一不可伪造的部分(设计 §1.6)
  string reason = 8;                  // ≤ 256B
  uint64 created_ms = 9;
}
