syntax = "proto3";
package mailpb;
option go_package = "proto/mail";
import "proto/common/base/tip.proto";
import "proto/common/base/service_call_auth.proto";
import "proto/mail/mail.proto";

// 内部发件接口不标客户端服务。每个caller独立密钥和可发频道白名单。
// 相同(sender_kind,request_id)重放先核载荷，不能因满箱/已过期重复发件。
message SendMailRequest {
  uint32 sender_kind = 1;
  uint64 request_id = 2;
  uint64 recipient_player_id = 3;
  uint64 guild_id = 4;
  string title = 5;
  string body = 6;
  MailAttachments attachments = 7;
  uint64 expire_ms = 8;
  common.base.ServiceCallAuth auth = 9;
  // 系统附件必须先导入冻结名单并seal。纯文本及个人邮件这些字段须为0/空。
  uint64 campaign_id = 10;
  uint64 manifest_generation = 11;
  uint64 expected_recipient_count = 12;
  uint32 expected_shard_count = 13;
  // SHA256("v1\n" + 按shard_index升序拼接 "index:lowercase_sha256:count\n")。
  // shard摘要是去重并按uint64升序的player_id十进制字符串，每个后接\n的SHA256。
  string manifest_hash = 14;
}
message SendMailResponse { TipInfoMessage error_message = 1; uint64 mail_id = 2; bool duplicated = 3; }
message ImportMailRecipientsRequest {
  uint32 sender_kind = 1;
  uint64 campaign_id = 2;
  uint64 manifest_generation = 3;
  uint32 shard_index = 4;
  repeated uint64 player_ids = 5;
  common.base.ServiceCallAuth auth = 6;
}
message ImportMailRecipientsResponse { TipInfoMessage error_message = 1; uint64 imported_count = 2; bool duplicated = 3; }
message SealMailCampaignRequest {
  uint32 sender_kind = 1;
  uint64 campaign_id = 2;
  uint64 manifest_generation = 3;
  common.base.ServiceCallAuth auth = 4;
}
service MailAdmin {
  rpc SendPersonalMail(SendMailRequest) returns (SendMailResponse);
  // 系统及帮会附件的领取资格须服务端判定；不得把广播通知当玩家资产直接入账。
  rpc SendSystemMail(SendMailRequest) returns (SendMailResponse);
  rpc SendGuildMail(SendMailRequest) returns (SendMailResponse);
  rpc ImportMailRecipients(ImportMailRecipientsRequest) returns (ImportMailRecipientsResponse);
  rpc SealMailCampaign(SealMailCampaignRequest) returns (SendMailResponse);
}
