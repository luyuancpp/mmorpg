syntax = "proto3";
package mailpb;
option go_package = "proto/mail";
import "proto/db/proto_option.proto";
import "proto/common/base/tip.proto";
option (OptionFileDefaultNode) = NODE_MAIL;

// 邮件是玩家可见业务。player_inbox只承接非资产scene待办，不承接本协议。
// 我是谁只取gate会话。附件由服务端持久指令到账，客户端不修改资产。
enum MailKind { MAIL_KIND_UNSPECIFIED = 0; MAIL_KIND_PERSONAL = 1; MAIL_KIND_SYSTEM = 2; MAIL_KIND_GUILD = 3; }
enum MailClaimState {
  MAIL_CLAIM_NONE = 0;
  MAIL_CLAIM_UNCLAIMED = 1;
  MAIL_CLAIM_PENDING = 2;
  MAIL_CLAIM_CLAIMED = 3;
  MAIL_CLAIM_MANUAL = 4;
}
message MailCurrency { uint32 currency_type = 1; uint64 amount = 2; }
message MailItem { uint32 config_id = 1; uint32 count = 2; }
// 仅新授予凭证；既有装备/宝宝的托管转让由共用资产实例契约承接，不重铸替代。
message MailAttachments { repeated MailCurrency currencies = 1; repeated MailItem items = 2; }
message MailView {
  uint64 mail_id = 1;
  MailKind kind = 2;
  string title = 3;
  string body = 4;
  uint64 sent_ms = 5;
  uint64 expire_ms = 6;
  bool is_read = 7;
  MailClaimState claim_state = 8;
  MailAttachments attachments = 9;
  uint64 asset_op_id = 10;
  TipInfoMessage claim_reason = 11;
}
message ListMailsRequest { uint64 before_mail_id = 1; uint32 limit = 2; }
message ListMailsResponse {
  TipInfoMessage error_message = 1;
  repeated MailView mails = 2;
  uint64 next_before_mail_id = 3;
  uint32 unread_count = 4;
  uint32 claimable_count = 5;
  uint64 server_now_ms = 6;
}
message ReadMailRequest { uint64 mail_id = 1; }
message ReadMailResponse { TipInfoMessage error_message = 1; MailView mail = 2; }
message ClaimMailAttachmentsRequest { repeated uint64 mail_ids = 1; }
message MailActionResult { uint64 mail_id = 1; TipInfoMessage error_message = 2; MailClaimState claim_state = 3; uint64 asset_op_id = 4; }
message ClaimMailAttachmentsResponse { TipInfoMessage error_message = 1; repeated MailActionResult results = 2; }
message DeleteMailsRequest { repeated uint64 mail_ids = 1; }
message DeleteMailsResponse { TipInfoMessage error_message = 1; repeated uint64 deleted_mail_ids = 2; repeated uint64 protected_mail_ids = 3; }
message ClearReadMailsRequest {}
message ClearReadMailsResponse { TipInfoMessage error_message = 1; repeated uint64 deleted_mail_ids = 2; repeated uint64 protected_mail_ids = 3; }
message MailChangedEvent { uint64 mail_id = 1; }
service ClientPlayerMail {
  option (OptionIsClientProtocolService) = true;
  rpc ListMails(ListMailsRequest) returns (ListMailsResponse);
  rpc ReadMail(ReadMailRequest) returns (ReadMailResponse);
  rpc ClaimMailAttachments(ClaimMailAttachmentsRequest) returns (ClaimMailAttachmentsResponse);
  rpc DeleteMails(DeleteMailsRequest) returns (DeleteMailsResponse);
  rpc ClearReadMails(ClearReadMailsRequest) returns (ClearReadMailsResponse);
  // S2C提醒可丢；权威状态由ListMails恢复，客户端来源禁止调用。
  rpc NotifyMailChanged(MailChangedEvent) returns (MailChangedEvent);
}
