
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "EquipAffixPoolTableOuterClass";
option java_multiple_files = true;


message EquipAffixPoolTable {
	uint32 id = 1;
	uint32 pool_id = 2;
	uint32 attr_id = 3;
	uint32 weight = 4;
}

message EquipAffixPoolTableData {
	repeated EquipAffixPoolTable data = 1;
}