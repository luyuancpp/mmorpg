
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "EquipGemSocketTableOuterClass";
option java_multiple_files = true;


message EquipGemSocketTable {
	uint32 id = 1;
	uint32 equip_kind = 2;
	uint32 socket = 3;
	uint32 gem_type = 4;
	string name = 5;
}

message EquipGemSocketTableData {
	repeated EquipGemSocketTable data = 1;
}