
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "ItemTableOuterClass";
option java_multiple_files = true;


message Itembase_attr {
	uint32 base_attr_id = 1;
	uint32 base_attr_value = 2;
}

message ItemTable {
	uint32 id = 1;
	uint32 max_stack_size = 2;
	uint32 equip_kind = 3;
	uint32 battle_usable = 4;
	uint64 battle_heal_hp = 5;
	uint64 battle_heal_mp = 6;
	string name = 7;
	string description = 8;
	string icon_key = 9;
	uint32 equip_level = 10;
	uint32 equip_class = 11;
	uint32 affix_pool = 12;
	uint32 affix_rule = 13;
	repeated Itembase_attr base_attr = 14;
}

message ItemTableData {
	repeated ItemTable data = 1;
}