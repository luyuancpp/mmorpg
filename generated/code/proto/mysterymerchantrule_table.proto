
syntax = "proto3";

option go_package = "generated/pb/table";

option java_package = "com.game.table";
option java_outer_classname = "MysteryMerchantRuleTableOuterClass";
option java_multiple_files = true;


message MysteryMerchantRuleTable {
	uint32 id = 1;
	uint32 interval_seconds = 2;
	uint32 stay_seconds = 3;
	uint32 shelf_size = 4;
	uint32 weight_discount60 = 5;
	uint32 weight_discount50 = 6;
	uint32 weight_discount40 = 7;
	uint32 interact_range = 8;
	string desc = 9;
}

message MysteryMerchantRuleTableData {
	repeated MysteryMerchantRuleTable data = 1;
}