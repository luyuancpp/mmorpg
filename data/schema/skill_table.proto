syntax = "proto3";

// Skill 表的权威 schema。源表 data/Skill.xlsx。
//
// 本文件不参与 protoc 编译,也不进任何语言的构建;导表器直接文本解析它。
// 字段号是从 generated/code/proto/skill_table.proto 抄来的现状值,**只增不改、删字段用 reserved**。

package mmorpg.cfgtable.v1;

import "cfg_options.proto";

message Skillcost_resource {
  uint32 cost_resource_id = 1;
  uint32 cost_resource_cost = 2;
}

message Skillrequired_item {
  uint32 required_item_type = 1;
  uint64 required_item_value = 2;
}

message Skillrequired_resource {
  uint32 required_resource_type = 1;
  uint32 required_resource_value = 2;
}

message SkillTable {
  option (cfg_sheet)       = "Skill";
  option (cfg_source_file) = "Skill.xlsx";
  option (cfg_primary_key) = "id";

  uint32 id = 1;
  // enum eSkillType : uint32_t {
  //  kPassiveSkill = 1 << 0,    // 被动技能
  //  kGeneralSkill = 1 << 1,    // 普通施法技能
  //  kChannelSkill = 1 << 2,    // 持续施法技能
  //  kToggleSkill = 1 << 3,     // 开关类技能
  //  kActivateSkill = 1 << 4,    // 激活类技能
  //  kBasicAttack   = 1 << 5  // 普通攻击技能的单独枚举
  // };
  repeated uint32 skill_type = 2 [(cfg_slots) = 2];
  // 0技能释放时不需要目标即可释放（如群疗，踩地板技能） -> 1 << 1
  // 1技能释放时需要选定目标（单体指向性技能） -> 1 << 2
  // 2技能释放时需要以指定地点为目标（常用于AOE技能） -> 1 << 3
  repeated uint32 targeting_mode = 3 [(cfg_slots) = 2];
  // 目标
  uint32 require_target = 4;
  // 目标状态
  uint32 target_status = 5;
  // CastPoint(毫秒Spell时间点）,
  // 一般为动画抬手到攻击帧时长。比如说播放一个挥刀动画0.3秒后动画到攻击点，这时策划就配置CastPoint为0.3秒。
  double cast_point = 6;
  // 后摇阶段一般不能被其他技能打断，除非是连招或者强制立即释放类技能。我们的技能系统不需要引入公共CD这个概念，通过前摇后摇阶段的划分就足够满足各种需求了
  double recovery_time = 7;
  // 技能前摇阶段不允许其他技能释放，除非技能可强制立即释放（bImmediately=true）（如有些游戏要求滚动还有解控技可以立即打断当前技能）
  uint32 immediate = 8;
  repeated Skillrequired_item required_item = 21 [(cfg_slots) = 2];
  repeated Skillrequired_resource required_resource = 22 [(cfg_slots) = 2];
  repeated uint32 effect = 9 [(cfg_slots) = 8];
  uint32 channel_think = 10;
  uint32 channel_finish = 11;
  uint32 think_interval = 12;
  uint32 channel_time = 13;
  // 资源条件
  repeated Skillcost_resource cost_resource = 23 [(cfg_slots) = 4];
  // 技能范围
  double range = 14;
  // 最大距离
  double max_range = 15;
  // 最小距离
  double min_range = 16;
  // 自身状态
  uint32 self_status = 17;
  // 所需状态
  uint32 required_status = 18;
  // 所需状态
  uint32 cooldown_id = 19;
  string damage = 20 [(cfg_expr_type) = "double", (cfg_expr_param) = "level"];
  // 伤害类型(2026-09-13):0 = 法术,吃法伤(缺省,老行保持原行为);1 = 物理,吃物伤。
  // 与 skill_type(施法行为位)无关;取值见 cpp/libs/services/battle/system/combat_damage_rules.h
  uint32 damage_type = 24;
  // 攻击倍率:伤害里物伤 / 法伤那部分乘以本值;0 = 按 1 倍(老行兼容),负数视为坏表、不加攻击
  double attack_multiplier = 25;

  // ---- 四职业技能(2026-10-19,docs/design/class-skills.md;内容基线 image/designs/class-skills-20260928/catalog.json)----
  // class_id = 0 的老行一律不读下面这些列,行为不变。比例列统一用 0~1 小数:0.20 = 20%。
  // 职业(Class 表 id);0 = 旧通用技能(不分等级,不进技能书)
  uint32 class_id = 26;
  string name = 27;
  string description = 28;
  // 客户端图标的 Resources 相对键,不带扩展名(如 UI/Skills/1101)
  string icon_key = 29;
  // 展示分类(主动 / 被动),只用于展示
  string category = 30;
  // 学习所需角色等级;等级上限 = min(max_rank, 1 + (角色等级 - unlock_level) / 2),未到解锁等级为 0
  uint32 unlock_level = 31;
  // 最高重数(四职业统一 10)
  uint32 max_rank = 32;
  // 目标阵营:1 = 敌方,2 = 友方(含自己与宝宝),3 = 仅自身
  uint32 target_team = 33;
  // 最多命中几个目标(选中的合法主目标优先,其余按规则补足)
  uint32 max_targets = 34;
  // 耗蓝 = ceil(最大法力 × 本值),本值 > 0 时至少 1
  double mana_percent = 35;
  // 施放后要隔几个完整回合才能再放;0 = 无冷却
  uint32 cooldown_rounds = 36;
  // 治疗量 = (法伤 × heal_multiplier + 角色等级 × heal_per_level) × 等级系数 × (1 + 治疗加成被动)
  double heal_multiplier = 37;
  double heal_per_level = 38;
  // 目标气血比例低于 threshold 时,治疗量再 × (1 + bonus)
  double execute_heal_threshold = 39;
  double execute_heal_bonus = 40;
  // 回复目标最大法力的比例(按实际回复量封顶)
  double restore_mana_percent = 41;
  // 驱散目标身上几个减益
  uint32 dispel_count = 42;
  // 先手优先级:本回合用它出手时排在速度之前(大的先动);0 = 不改出手序
  int32 initiative = 43;
  // 被动加成的属性:defense / physicalAttack / magicAttack / maxHp / maxMp / speed / crit / outgoingHeal;空 = 不是被动
  string passive_stat = 44;
  // 被动基础幅度(crit 为暴击率百分点 / 100,其余为比例)
  double passive_percent = 45;
  // effect[] 里那个增益 / 减益的基础幅度(带符号比例);生效值按施法者技能等级放大后存进局内 buff
  double buff_percent = 46;
}
